<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 180" fill="none">
  <style>
    text { font-family: 'Segoe UI', system-ui, sans-serif; }
    .box { font-size: 12px; font-weight: 500; fill: #1e1e1e; }
    .box-sm { font-size: 10px; fill: #1e1e1e; }
    .detail { font-size: 10px; fill: #757575; }
    .stage { font-size: 18px; font-weight: 700; fill: #e5e5e5; }
    .num { font-size: 10px; font-weight: 700; fill: #6d28d9; }
  </style>
  <rect width="820" height="180" rx="10" fill="#141419"/>

  <!-- Source -->
  <rect x="15" y="45" width="90" height="50" rx="7" fill="#4a9eed" opacity="0.85"/>
  <text x="60" y="67" text-anchor="middle" class="box">Clone Repo</text>
  <text x="60" y="81" text-anchor="middle" class="box-sm">from Gitea</text>
  <line x1="105" y1="70" x2="128" y2="70" stroke="#a0a0a0" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 5 stages zone -->
  <rect x="128" y="20" width="570" height="105" rx="8" fill="#8b5cf6" opacity="0.08" stroke="#8b5cf6" stroke-opacity="0.25"/>
  <text x="140" y="35" class="detail" fill="#8b5cf6">5 Sequential LLM Sessions</text>

  <rect x="140" y="45" width="95" height="50" rx="6" fill="#8b5cf6" opacity="0.55"/>
  <text x="145" y="56" class="num">1</text>
  <text x="187" y="67" text-anchor="middle" class="box-sm">File Tree</text>
  <text x="187" y="81" text-anchor="middle" class="box-sm">Analysis</text>
  <line x1="235" y1="70" x2="248" y2="70" stroke="#8b5cf6" stroke-width="1" stroke-opacity="0.5" marker-end="url(#arr-p)"/>

  <rect x="248" y="45" width="95" height="50" rx="6" fill="#8b5cf6" opacity="0.55"/>
  <text x="253" y="56" class="num">2</text>
  <text x="295" y="67" text-anchor="middle" class="box-sm">Core</text>
  <text x="295" y="81" text-anchor="middle" class="box-sm">Architecture</text>
  <line x1="343" y1="70" x2="356" y2="70" stroke="#8b5cf6" stroke-width="1" stroke-opacity="0.5" marker-end="url(#arr-p)"/>

  <rect x="356" y="45" width="95" height="50" rx="6" fill="#8b5cf6" opacity="0.55"/>
  <text x="361" y="56" class="num">3</text>
  <text x="403" y="67" text-anchor="middle" class="box-sm">Component</text>
  <text x="403" y="81" text-anchor="middle" class="box-sm">Interfaces</text>
  <line x1="451" y1="70" x2="464" y2="70" stroke="#8b5cf6" stroke-width="1" stroke-opacity="0.5" marker-end="url(#arr-p)"/>

  <rect x="464" y="45" width="95" height="50" rx="6" fill="#8b5cf6" opacity="0.55"/>
  <text x="469" y="56" class="num">4</text>
  <text x="511" y="67" text-anchor="middle" class="box-sm">README</text>
  <text x="511" y="81" text-anchor="middle" class="box-sm">Generation</text>
  <line x1="559" y1="70" x2="572" y2="70" stroke="#8b5cf6" stroke-width="1" stroke-opacity="0.5" marker-end="url(#arr-p)"/>

  <rect x="572" y="45" width="115" height="50" rx="6" fill="#8b5cf6" opacity="0.55"/>
  <text x="577" y="56" class="num">5</text>
  <text x="629" y="67" text-anchor="middle" class="box-sm">LLM Context</text>
  <text x="629" y="81" text-anchor="middle" class="box-sm">File</text>

  <!-- Commit -->
  <line x1="687" y1="70" x2="715" y2="70" stroke="#a0a0a0" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="715" y="40" width="90" height="60" rx="7" fill="#22c55e" opacity="0.3" stroke="#22c55e" stroke-opacity="0.5"/>
  <text x="760" y="63" text-anchor="middle" class="box" fill="#86efac">Auto-commit</text>
  <text x="760" y="78" text-anchor="middle" class="box-sm" fill="#86efac">to branch</text>

  <!-- Branch name -->
  <text x="760" y="118" text-anchor="middle" class="detail">docs/benchmark-{model}-{date}</text>

  <!-- Loop note -->
  <text x="410" y="150" text-anchor="middle" class="detail">Repeats per model — each gets its own branch with all 5 outputs</text>

  <defs>
    <marker id="arr" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5" fill="#a0a0a0"/>
    </marker>
    <marker id="arr-p" markerWidth="6" markerHeight="4" refX="6" refY="2" orient="auto">
      <path d="M0,0 L6,2 L0,4" fill="#8b5cf6" opacity="0.5"/>
    </marker>
  </defs>
</svg>