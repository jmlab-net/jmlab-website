<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 700" fill="none">
  <style>
    text { font-family: 'Segoe UI', system-ui, sans-serif; }
    .title { font-size: 22px; font-weight: 700; fill: #e5e5e5; }
    .subtitle { font-size: 13px; fill: #a0a0a0; }
    .zone-label { font-size: 12px; font-weight: 600; }
    .box-label { font-size: 14px; font-weight: 500; fill: #1e1e1e; }
    .box-label-sm { font-size: 11px; fill: #1e1e1e; }
    .arrow-label { font-size: 11px; fill: #a0a0a0; }
    .table-label { font-size: 11px; font-weight: 500; fill: #1e1e1e; }
    .phase { font-size: 10px; font-weight: 600; letter-spacing: 0.05em; }
  </style>

  <!-- Background -->
  <rect width="860" height="700" rx="12" fill="#141419"/>

  <!-- Title -->
  <text x="430" y="35" text-anchor="middle" class="title">Benchmark Pipeline Flow</text>
  <text x="430" y="55" text-anchor="middle" class="subtitle">n8n Orchestrated · 26 Models · 1,440 Runs</text>

  <!-- Phase 1 label -->
  <text x="30" y="78" class="phase" fill="#f59e0b">PHASE 1: PER-MODEL LOOP</text>

  <!-- Unraid Zone -->
  <rect x="30" y="90" width="180" height="110" rx="10" fill="#22c55e" opacity="0.1" stroke="#22c55e" stroke-opacity="0.3"/>
  <text x="45" y="110" class="zone-label" fill="#22c55e">Unraid Server</text>
  <rect x="50" y="122" width="140" height="50" rx="8" fill="#f59e0b" opacity="0.85"/>
  <text x="120" y="152" text-anchor="middle" class="box-label">n8n Workflow</text>

  <!-- SSH Arrow -->
  <line x1="190" y1="147" x2="270" y2="147" stroke="#a0a0a0" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="230" y="140" text-anchor="middle" class="arrow-label">SSH</text>

  <!-- MacBook Zone -->
  <rect x="270" y="90" width="200" height="110" rx="10" fill="#4a9eed" opacity="0.1" stroke="#4a9eed" stroke-opacity="0.3"/>
  <text x="285" y="110" class="zone-label" fill="#4a9eed">M5 MacBook Pro</text>
  <rect x="290" y="122" width="160" height="50" rx="8" fill="#4a9eed" opacity="0.85"/>
  <text x="370" y="152" text-anchor="middle" class="box-label">LM Studio + Model</text>

  <!-- Prompts Arrow -->
  <line x1="370" y1="200" x2="370" y2="240" stroke="#a0a0a0" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="400" y="225" class="arrow-label">20 prompts</text>

  <!-- Benchmark Categories Zone -->
  <rect x="80" y="245" width="530" height="85" rx="10" fill="#8b5cf6" opacity="0.1" stroke="#8b5cf6" stroke-opacity="0.3"/>
  <text x="95" y="263" class="zone-label" fill="#8b5cf6">4 Benchmark Categories</text>

  <rect x="95" y="273" width="115" height="44" rx="6" fill="#8b5cf6" opacity="0.75"/>
  <text x="152" y="292" text-anchor="middle" class="box-label-sm">GSM8K</text>
  <text x="152" y="308" text-anchor="middle" class="box-label-sm">Math</text>

  <rect x="220" y="273" width="115" height="44" rx="6" fill="#8b5cf6" opacity="0.75"/>
  <text x="277" y="292" text-anchor="middle" class="box-label-sm">HumanEval</text>
  <text x="277" y="308" text-anchor="middle" class="box-label-sm">Code</text>

  <rect x="345" y="273" width="115" height="44" rx="6" fill="#8b5cf6" opacity="0.75"/>
  <text x="402" y="292" text-anchor="middle" class="box-label-sm">MMLU</text>
  <text x="402" y="308" text-anchor="middle" class="box-label-sm">Factual</text>

  <rect x="470" y="273" width="125" height="44" rx="6" fill="#8b5cf6" opacity="0.75"/>
  <text x="532" y="292" text-anchor="middle" class="box-label-sm">IFEval</text>
  <text x="532" y="308" text-anchor="middle" class="box-label-sm">Instruction</text>

  <!-- Responses Arrow -->
  <line x1="345" y1="330" x2="345" y2="370" stroke="#a0a0a0" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="375" y="355" class="arrow-label">responses</text>

  <!-- Layer 1 Scoring (inline) -->
  <rect x="180" y="375" width="330" height="65" rx="10" fill="#f59e0b" opacity="0.08" stroke="#f59e0b" stroke-opacity="0.3"/>
  <text x="195" y="393" class="zone-label" fill="#f59e0b">Layer 1: Auto Pass/Fail (inline)</text>
  <rect x="200" y="403" width="290" height="28" rx="6" fill="#f59e0b" opacity="0.65"/>
  <text x="345" y="422" text-anchor="middle" class="box-label-sm">Deterministic validation · regex · code exec</text>

  <!-- To DB Arrow -->
  <line x1="345" y1="440" x2="345" y2="470" stroke="#a0a0a0" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Notify + Unload (side by side) -->
  <rect x="200" y="475" width="140" height="45" rx="7" fill="#ef4444" opacity="0.2" stroke="#ef4444" stroke-opacity="0.4"/>
  <text x="270" y="497" text-anchor="middle" class="box-label-sm" fill="#fca5a5">Notify Mattermost</text>
  <text x="270" y="512" text-anchor="middle" class="box-label-sm" fill="#fca5a5">Progress</text>

  <rect x="360" y="475" width="140" height="45" rx="7" fill="#4a9eed" opacity="0.85"/>
  <text x="430" y="497" text-anchor="middle" class="box-label-sm">SSH Unload Model</text>
  <text x="430" y="512" text-anchor="middle" class="box-label-sm">lms unload --all</text>

  <!-- Phase 2 label -->
  <text x="30" y="548" class="phase" fill="#8b5cf6">PHASE 2: POST-RUN REVIEW</text>

  <!-- Layer 2 Scoring (separate, after unload) -->
  <rect x="80" y="558" width="530" height="60" rx="10" fill="#8b5cf6" opacity="0.08" stroke="#8b5cf6" stroke-opacity="0.3"/>
  <text x="95" y="576" class="zone-label" fill="#8b5cf6">Layer 2: Independent Rubric Review</text>
  <rect x="100" y="586" width="200" height="24" rx="6" fill="#8b5cf6" opacity="0.5"/>
  <text x="200" y="603" text-anchor="middle" class="box-label-sm">Claude API · 5 dims · 1-3 scale</text>
  <rect x="310" y="586" width="280" height="24" rx="6" fill="#8b5cf6" opacity="0.5"/>
  <text x="450" y="603" text-anchor="middle" class="box-label-sm">Scores stored → response_scores table</text>

  <!-- PostgreSQL Zone -->
  <rect x="120" y="640" width="440" height="45" rx="10" fill="#22c55e" opacity="0.1" stroke="#22c55e" stroke-opacity="0.3"/>
  <text x="135" y="658" class="zone-label" fill="#22c55e">PostgreSQL</text>

  <rect x="230" y="647" width="90" height="30" rx="6" fill="#22c55e" opacity="0.25" stroke="#22c55e" stroke-opacity="0.4"/>
  <text x="275" y="667" text-anchor="middle" class="table-label">prompt_results</text>

  <rect x="330" y="647" width="100" height="30" rx="6" fill="#22c55e" opacity="0.25" stroke="#22c55e" stroke-opacity="0.4"/>
  <text x="380" y="667" text-anchor="middle" class="table-label">response_scores</text>

  <rect x="440" y="647" width="100" height="30" rx="6" fill="#22c55e" opacity="0.25" stroke="#22c55e" stroke-opacity="0.4"/>
  <text x="490" y="667" text-anchor="middle" class="table-label">+ 3 more</text>

  <!-- Arrows into DB -->
  <line x1="345" y1="520" x2="305" y2="640" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.4" marker-end="url(#arrow-amber)"/>
  <line x1="345" y1="618" x2="345" y2="640" stroke="#8b5cf6" stroke-width="1" stroke-opacity="0.4" marker-end="url(#arrow-purple)"/>

  <!-- Mattermost final -->
  <line x1="560" y1="662" x2="650" y2="662" stroke="#ef4444" stroke-width="1.5" stroke-opacity="0.7" marker-end="url(#arrow-red)"/>
  <rect x="655" y="640" width="160" height="45" rx="8" fill="#ef4444" opacity="0.2" stroke="#ef4444" stroke-opacity="0.4"/>
  <text x="735" y="659" text-anchor="middle" class="box-label-sm" fill="#fca5a5">Mattermost</text>
  <text x="735" y="675" text-anchor="middle" class="box-label-sm" fill="#fca5a5">Leaderboard</text>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#a0a0a0"/>
    </marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#ef4444" opacity="0.7"/>
    </marker>
    <marker id="arrow-amber" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5" fill="#f59e0b" opacity="0.5"/>
    </marker>
    <marker id="arrow-purple" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5" fill="#8b5cf6" opacity="0.5"/>
    </marker>
  </defs>
</svg>
