<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 620" fill="none">
  <style>
    text { font-family: 'Segoe UI', system-ui, sans-serif; }
    .title { font-size: 22px; font-weight: 700; fill: #e5e5e5; }
    .subtitle { font-size: 13px; fill: #a0a0a0; }
    .zone-label { font-size: 12px; font-weight: 600; }
    .box-label { font-size: 14px; font-weight: 500; fill: #1e1e1e; }
    .box-label-sm { font-size: 11px; fill: #1e1e1e; }
    .arrow-label { font-size: 11px; fill: #a0a0a0; }
    .table-label { font-size: 11px; font-weight: 500; fill: #1e1e1e; }
  </style>

  <!-- Background -->
  <rect width="860" height="620" rx="12" fill="#141419"/>

  <!-- Title -->
  <text x="430" y="35" text-anchor="middle" class="title">Benchmark Pipeline Flow</text>
  <text x="430" y="55" text-anchor="middle" class="subtitle">n8n Orchestrated · 24 Models · 1,440 Runs</text>

  <!-- Unraid Zone -->
  <rect x="30" y="80" width="180" height="110" rx="10" fill="#22c55e" opacity="0.1" stroke="#22c55e" stroke-opacity="0.3"/>
  <text x="45" y="100" class="zone-label" fill="#22c55e">Unraid Server</text>
  <rect x="50" y="112" width="140" height="50" rx="8" fill="#f59e0b" opacity="0.85"/>
  <text x="120" y="142" text-anchor="middle" class="box-label">n8n Workflow</text>

  <!-- SSH Arrow -->
  <line x1="190" y1="137" x2="270" y2="137" stroke="#a0a0a0" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="230" y="130" text-anchor="middle" class="arrow-label">SSH</text>

  <!-- MacBook Zone -->
  <rect x="270" y="80" width="200" height="110" rx="10" fill="#4a9eed" opacity="0.1" stroke="#4a9eed" stroke-opacity="0.3"/>
  <text x="285" y="100" class="zone-label" fill="#4a9eed">M5 MacBook Pro</text>
  <rect x="290" y="112" width="160" height="50" rx="8" fill="#4a9eed" opacity="0.85"/>
  <text x="370" y="142" text-anchor="middle" class="box-label">LM Studio + Model</text>

  <!-- Prompts Arrow -->
  <line x1="370" y1="190" x2="370" y2="230" stroke="#a0a0a0" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="400" y="215" class="arrow-label">20 prompts</text>

  <!-- Benchmark Categories Zone -->
  <rect x="80" y="235" width="530" height="85" rx="10" fill="#8b5cf6" opacity="0.1" stroke="#8b5cf6" stroke-opacity="0.3"/>
  <text x="95" y="253" class="zone-label" fill="#8b5cf6">4 Benchmark Categories</text>

  <rect x="95" y="263" width="115" height="44" rx="6" fill="#8b5cf6" opacity="0.75"/>
  <text x="152" y="282" text-anchor="middle" class="box-label-sm">GSM8K</text>
  <text x="152" y="298" text-anchor="middle" class="box-label-sm">Math</text>

  <rect x="220" y="263" width="115" height="44" rx="6" fill="#8b5cf6" opacity="0.75"/>
  <text x="277" y="282" text-anchor="middle" class="box-label-sm">HumanEval</text>
  <text x="277" y="298" text-anchor="middle" class="box-label-sm">Code</text>

  <rect x="345" y="263" width="115" height="44" rx="6" fill="#8b5cf6" opacity="0.75"/>
  <text x="402" y="282" text-anchor="middle" class="box-label-sm">MMLU</text>
  <text x="402" y="298" text-anchor="middle" class="box-label-sm">Factual</text>

  <rect x="470" y="263" width="125" height="44" rx="6" fill="#8b5cf6" opacity="0.75"/>
  <text x="532" y="282" text-anchor="middle" class="box-label-sm">IFEval</text>
  <text x="532" y="298" text-anchor="middle" class="box-label-sm">Instruction</text>

  <!-- Responses Arrow -->
  <line x1="345" y1="320" x2="345" y2="360" stroke="#a0a0a0" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="375" y="345" class="arrow-label">responses</text>

  <!-- Scoring Zone -->
  <rect x="80" y="365" width="530" height="105" rx="10" fill="#f59e0b" opacity="0.08" stroke="#f59e0b" stroke-opacity="0.3"/>
  <text x="95" y="383" class="zone-label" fill="#f59e0b">Two-Layer Scoring</text>

  <rect x="100" y="393" width="240" height="55" rx="8" fill="#f59e0b" opacity="0.75"/>
  <text x="220" y="416" text-anchor="middle" class="box-label-sm">Layer 1: Auto Pass/Fail</text>
  <text x="220" y="434" text-anchor="middle" class="box-label-sm">regex · code exec · match</text>

  <rect x="355" y="393" width="240" height="55" rx="8" fill="#f59e0b" opacity="0.75"/>
  <text x="475" y="416" text-anchor="middle" class="box-label-sm">Layer 2: Rubric Review</text>
  <text x="475" y="434" text-anchor="middle" class="box-label-sm">5 dims · 1-3 scale · /15</text>

  <!-- To DB Arrow -->
  <line x1="345" y1="470" x2="345" y2="505" stroke="#a0a0a0" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- PostgreSQL Zone -->
  <rect x="120" y="510" width="440" height="85" rx="10" fill="#22c55e" opacity="0.1" stroke="#22c55e" stroke-opacity="0.3"/>
  <text x="135" y="528" class="zone-label" fill="#22c55e">PostgreSQL</text>

  <rect x="140" y="540" width="90" height="38" rx="6" fill="#22c55e" opacity="0.25" stroke="#22c55e" stroke-opacity="0.4"/>
  <text x="185" y="564" text-anchor="middle" class="table-label">runs</text>

  <rect x="240" y="540" width="90" height="38" rx="6" fill="#22c55e" opacity="0.25" stroke="#22c55e" stroke-opacity="0.4"/>
  <text x="285" y="564" text-anchor="middle" class="table-label">models</text>

  <rect x="340" y="540" width="90" height="38" rx="6" fill="#22c55e" opacity="0.25" stroke="#22c55e" stroke-opacity="0.4"/>
  <text x="385" y="564" text-anchor="middle" class="table-label">prompts</text>

  <rect x="440" y="540" width="100" height="38" rx="6" fill="#22c55e" opacity="0.25" stroke="#22c55e" stroke-opacity="0.4"/>
  <text x="490" y="564" text-anchor="middle" class="table-label">rubrics</text>

  <!-- Mattermost -->
  <line x1="560" y1="558" x2="650" y2="558" stroke="#ef4444" stroke-width="1.5" stroke-opacity="0.7" marker-end="url(#arrow-red)"/>
  <rect x="655" y="533" width="160" height="50" rx="8" fill="#ef4444" opacity="0.2" stroke="#ef4444" stroke-opacity="0.4"/>
  <text x="735" y="554" text-anchor="middle" class="box-label-sm" fill="#fca5a5">Mattermost</text>
  <text x="735" y="572" text-anchor="middle" class="box-label-sm" fill="#fca5a5">Leaderboard</text>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#a0a0a0"/>
    </marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#ef4444" opacity="0.7"/>
    </marker>
  </defs>
</svg>