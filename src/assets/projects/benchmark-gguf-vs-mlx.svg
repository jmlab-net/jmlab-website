<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 320" fill="none">
  <style>
    text { font-family: 'Segoe UI', system-ui, sans-serif; }
    .title { font-size: 18px; font-weight: 700; fill: #e5e5e5; }
    .sub { font-size: 12px; fill: #a0a0a0; }
    .model { font-size: 12px; font-weight: 500; fill: #e5e5e5; }
    .val { font-size: 13px; font-weight: 600; }
    .gain { font-size: 12px; font-weight: 600; fill: #22c55e; }
    .leg { font-size: 11px; fill: #a0a0a0; }
    .axis { font-size: 10px; fill: #757575; }
    .note { font-size: 11px; fill: #757575; }
  </style>
  <rect width="700" height="320" rx="10" fill="#141419"/>

  <!-- Title -->
  <text x="350" y="28" text-anchor="middle" class="title">GGUF vs MLX Throughput</text>
  <text x="350" y="45" text-anchor="middle" class="sub">Same models, two quantization formats on Apple Silicon</text>

  <!-- Legend -->
  <rect x="480" y="15" width="14" height="14" rx="3" fill="#4a9eed" opacity="0.8"/>
  <text x="500" y="26" class="leg">GGUF</text>
  <rect x="545" y="15" width="14" height="14" rx="3" fill="#22c55e" opacity="0.8"/>
  <text x="565" y="26" class="leg">MLX</text>

  <!-- Y axis -->
  <line x1="65" y1="70" x2="65" y2="250" stroke="#333" stroke-width="1"/>
  <text x="30" y="155" text-anchor="middle" class="axis" transform="rotate(-90, 30, 155)">tokens / sec</text>

  <!-- Grid lines -->
  <text x="55" y="82" text-anchor="end" class="axis">144</text>
  <line x1="65" y1="78" x2="660" y2="78" stroke="#333" stroke-width="0.5" stroke-dasharray="3,3" opacity="0.4"/>
  <text x="55" y="122" text-anchor="end" class="axis">100</text>
  <line x1="65" y1="118" x2="660" y2="118" stroke="#333" stroke-width="0.5" stroke-dasharray="3,3" opacity="0.4"/>
  <text x="55" y="168" text-anchor="end" class="axis">50</text>
  <line x1="65" y1="164" x2="660" y2="164" stroke="#333" stroke-width="0.5" stroke-dasharray="3,3" opacity="0.4"/>
  <text x="55" y="253" text-anchor="end" class="axis">0</text>
  <line x1="65" y1="250" x2="660" y2="250" stroke="#333" stroke-width="1"/>

  <!-- Model 1: DeepSeek Coder V2 Lite -->
  <text x="160" y="275" text-anchor="middle" class="model">DeepSeek Coder V2 Lite</text>

  <!-- GGUF bar: 47.2 → height proportional (47.2/144 * 172 = 56.4) -->
  <rect x="110" y="193" width="40" height="57" rx="4" fill="#4a9eed" opacity="0.8"/>
  <text x="130" y="188" text-anchor="middle" class="val" fill="#93c5fd">47.2</text>

  <!-- MLX bar: 144.0 → height = 172 -->
  <rect x="158" y="78" width="40" height="172" rx="4" fill="#22c55e" opacity="0.8"/>
  <text x="178" y="73" text-anchor="middle" class="val" fill="#86efac">144.0</text>

  <text x="155" y="293" text-anchor="middle" class="gain">3.1x</text>

  <!-- Model 2: Mistral Small 24B -->
  <text x="370" y="275" text-anchor="middle" class="model">Mistral Small 24B</text>

  <!-- GGUF bar: 22.4 → 26.8 -->
  <rect x="325" y="223" width="40" height="27" rx="4" fill="#4a9eed" opacity="0.8"/>
  <text x="345" y="218" text-anchor="middle" class="val" fill="#93c5fd">22.4</text>

  <!-- MLX bar: 38.2 → 45.7 -->
  <rect x="373" y="204" width="40" height="46" rx="4" fill="#22c55e" opacity="0.8"/>
  <text x="393" y="199" text-anchor="middle" class="val" fill="#86efac">38.2</text>

  <text x="365" y="293" text-anchor="middle" class="gain">1.7x</text>

  <!-- Model 3: Qwen3.5 122B MoE -->
  <text x="570" y="275" text-anchor="middle" class="model">Qwen3.5 122B MoE</text>

  <!-- GGUF bar: 25.4 → 30.4 -->
  <rect x="525" y="219" width="40" height="31" rx="4" fill="#4a9eed" opacity="0.8"/>
  <text x="545" y="214" text-anchor="middle" class="val" fill="#93c5fd">25.4</text>

  <!-- MLX bar: 46.6 → 55.7 -->
  <rect x="573" y="194" width="40" height="56" rx="4" fill="#22c55e" opacity="0.8"/>
  <text x="593" y="189" text-anchor="middle" class="val" fill="#86efac">46.6</text>

  <text x="565" y="293" text-anchor="middle" class="gain">1.8x</text>

  <!-- Bottom note -->
  <text x="350" y="313" text-anchor="middle" class="note">MLX consistently outperforms GGUF on Apple Silicon — up to 3x on smaller models</text>
</svg>