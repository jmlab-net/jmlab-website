  <text x="875" y="138" class="tier-label" fill="#22c55e" opacity="0.6">Elite (≥0.95)</text>
  <rect x="90" y="189" width="780" height="90" fill="#4a9eed" opacity="0.03"/>
  <text x="875" y="238" class="tier-label" fill="#4a9eed" opacity="0.6">Strong (0.90–0.94)</text>
  <rect x="90" y="279" width="780" height="90" fill="#f59e0b" opacity="0.03"/>
  <text x="875" y="328" class="tier-label" fill="#f59e0b" opacity="0.6">Good (0.85–0.89)</text>
  <rect x="90" y="370" width="780" height="90" fill="#ef4444" opacity="0.03"/>
  <text x="875" y="419" class="tier-label" fill="#ef4444" opacity="0.6">Fair (0.80–0.84)</text>

  <!-- Scale: X = 90 + (tok/s / 150) * 780, Y = 460 - ((avg - 0.80) / 0.20) * 362 -->
  <!-- Bubble size = sqrt(GB) * 1.6, min 5 -->

