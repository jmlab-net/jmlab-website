  <text x="242" y="103" text-anchor="end" class="model-detail">31.7 tok/s</text>

  <!-- Nemotron GGUF: 27.6, 0.98, 85 GB → x=233.4, y=134.4, sz=14.7 -->
  <rect x="226" y="127" width="15" height="15" rx="2" fill="#4a9eed" opacity="0.6" stroke="#4a9eed" stroke-width="1.5" stroke-opacity="0.4"/>
  <text x="220" y="140" text-anchor="end" class="model-name" fill="#93c5fd">Nemotron Super</text>
  <text x="220" y="154" text-anchor="end" class="model-detail">0.98 · 27.6 tok/s</text>

