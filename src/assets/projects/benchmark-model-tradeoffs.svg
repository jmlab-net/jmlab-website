<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" fill="none">
  <style>
    text { font-family: 'Segoe UI', system-ui, sans-serif; }
    .title { font-size: 22px; font-weight: 700; fill: #e5e5e5; }
    .subtitle { font-size: 13px; fill: #a0a0a0; }
    .axis-label { font-size: 13px; font-weight: 600; fill: #a0a0a0; }
    .tick { font-size: 11px; fill: #757575; }
    .model-name { font-size: 11px; font-weight: 600; }
    .model-detail { font-size: 10px; fill: #a0a0a0; }
    .legend-text { font-size: 11px; fill: #a0a0a0; }
    .tier-label { font-size: 10px; font-weight: 500; fill: #555; }
  </style>
  <rect width="920" height="560" rx="12" fill="#141419"/>
  <text x="460" y="35" text-anchor="middle" class="title">Model Performance Tradeoffs</text>
  <text x="460" y="55" text-anchor="middle" class="subtitle">14 Models · GGUF vs MLX · Size vs Speed vs Accuracy</text>

  <!-- Axes -->
  <line x1="90" y1="80" x2="90" y2="460" stroke="#333" stroke-width="1.5"/>
  <text x="35" y="270" text-anchor="middle" class="axis-label" transform="rotate(-90, 35, 270)">Rubric Avg</text>

  <!-- Y ticks -->
  <line x1="85" y1="98" x2="95" y2="98" stroke="#444" stroke-width="1"/>
  <text x="80" y="102" text-anchor="end" class="tick">1.00</text>
  <line x1="85" y1="189" x2="95" y2="189" stroke="#444" stroke-width="1"/>
  <text x="80" y="193" text-anchor="end" class="tick">0.95</text>
  <line x1="90" y1="189" x2="870" y2="189" stroke="#333" stroke-width="0.5" stroke-dasharray="4,4" opacity="0.3"/>
  <line x1="85" y1="279" x2="95" y2="279" stroke="#444" stroke-width="1"/>
  <text x="80" y="283" text-anchor="end" class="tick">0.90</text>
  <line x1="90" y1="279" x2="870" y2="279" stroke="#333" stroke-width="0.5" stroke-dasharray="4,4" opacity="0.3"/>
  <line x1="85" y1="370" x2="95" y2="370" stroke="#444" stroke-width="1"/>
  <text x="80" y="374" text-anchor="end" class="tick">0.85</text>
  <line x1="90" y1="370" x2="870" y2="370" stroke="#333" stroke-width="0.5" stroke-dasharray="4,4" opacity="0.3"/>
  <line x1="85" y1="460" x2="95" y2="460" stroke="#444" stroke-width="1"/>
  <text x="80" y="464" text-anchor="end" class="tick">0.80</text>
  <line x1="90" y1="460" x2="870" y2="460" stroke="#333" stroke-width="0.5" stroke-dasharray="4,4" opacity="0.3"/>

  <!-- X axis -->
  <line x1="90" y1="460" x2="870" y2="460" stroke="#333" stroke-width="1.5"/>
  <text x="480" y="505" text-anchor="middle" class="axis-label">Tokens / sec</text>
  <text x="90" y="480" text-anchor="middle" class="tick">0</text>
  <line x1="220" y1="455" x2="220" y2="465" stroke="#444" stroke-width="1"/>
  <text x="220" y="480" text-anchor="middle" class="tick">25</text>
  <line x1="350" y1="455" x2="350" y2="465" stroke="#444" stroke-width="1"/>
  <text x="350" y="480" text-anchor="middle" class="tick">50</text>
  <line x1="480" y1="455" x2="480" y2="465" stroke="#444" stroke-width="1"/>
  <text x="480" y="480" text-anchor="middle" class="tick">75</text>
  <line x1="610" y1="455" x2="610" y2="465" stroke="#444" stroke-width="1"/>
  <text x="610" y="480" text-anchor="middle" class="tick">100</text>
  <line x1="740" y1="455" x2="740" y2="465" stroke="#444" stroke-width="1"/>
  <text x="740" y="480" text-anchor="middle" class="tick">125</text>
  <line x1="870" y1="455" x2="870" y2="465" stroke="#444" stroke-width="1"/>
  <text x="870" y="480" text-anchor="middle" class="tick">150</text>

