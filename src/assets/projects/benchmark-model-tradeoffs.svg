<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" fill="none">
  <style>
    text { font-family: 'Segoe UI', system-ui, sans-serif; }
    .title { font-size: 22px; font-weight: 700; fill: #e5e5e5; }
    .subtitle { font-size: 13px; fill: #a0a0a0; }
    .axis-label { font-size: 13px; font-weight: 600; fill: #a0a0a0; }
    .tick { font-size: 11px; fill: #757575; }
    .model-name { font-size: 12px; font-weight: 600; }
    .model-detail { font-size: 11px; fill: #a0a0a0; }
    .legend-text { font-size: 11px; fill: #a0a0a0; }
    .sweet-label { font-size: 11px; font-weight: 500; fill: #22c55e; opacity: 0.8; }
  </style>

  <rect width="760" height="520" rx="12" fill="#141419"/>

  <text x="380" y="35" text-anchor="middle" class="title">Model Performance Tradeoffs</text>
  <text x="380" y="55" text-anchor="middle" class="subtitle">26 Models · Size vs Speed vs Accuracy</text>

  <!-- Y Axis -->
  <line x1="80" y1="80" x2="80" y2="430" stroke="#333" stroke-width="1.5"/>
  <text x="35" y="260" text-anchor="middle" class="axis-label" transform="rotate(-90, 35, 260)">Rubric Avg</text>

  <!-- Y ticks: 1.00 at y=90, 0.90 at y=160, 0.80 at y=250, 0.70 at y=350 -->
  <line x1="75" y1="90" x2="85" y2="90" stroke="#444" stroke-width="1"/>
  <text x="65" y="94" text-anchor="end" class="tick">1.00</text>
  <line x1="80" y1="90" x2="690" y2="90" stroke="#333" stroke-width="0.5" stroke-dasharray="4,4" opacity="0.3"/>

  <line x1="75" y1="160" x2="85" y2="160" stroke="#444" stroke-width="1"/>
  <text x="65" y="164" text-anchor="end" class="tick">0.90</text>
  <line x1="80" y1="160" x2="690" y2="160" stroke="#333" stroke-width="0.5" stroke-dasharray="4,4" opacity="0.3"/>

  <line x1="75" y1="250" x2="85" y2="250" stroke="#444" stroke-width="1"/>
  <text x="65" y="254" text-anchor="end" class="tick">0.80</text>
  <line x1="80" y1="250" x2="690" y2="250" stroke="#333" stroke-width="0.5" stroke-dasharray="4,4" opacity="0.3"/>

  <line x1="75" y1="350" x2="85" y2="350" stroke="#444" stroke-width="1"/>
  <text x="65" y="354" text-anchor="end" class="tick">0.70</text>

  <!-- X Axis -->
  <line x1="80" y1="430" x2="700" y2="430" stroke="#333" stroke-width="1.5"/>
  <text x="390" y="470" text-anchor="middle" class="axis-label">Tokens / sec</text>

  <!-- X ticks: 0 at x=80, ~25 at x=180, ~50 at x=280, ~70 at x=360, ~100 at x=460, ~145 at x=640 -->
  <line x1="180" y1="425" x2="180" y2="435" stroke="#444" stroke-width="1"/>
  <text x="180" y="448" text-anchor="middle" class="tick">25</text>
  <line x1="280" y1="425" x2="280" y2="435" stroke="#444" stroke-width="1"/>
  <text x="280" y="448" text-anchor="middle" class="tick">50</text>
  <line x1="400" y1="425" x2="400" y2="435" stroke="#444" stroke-width="1"/>
  <text x="400" y="448" text-anchor="middle" class="tick">75</text>
  <line x1="520" y1="425" x2="520" y2="435" stroke="#444" stroke-width="1"/>
  <text x="520" y="448" text-anchor="middle" class="tick">100</text>
  <line x1="640" y1="425" x2="640" y2="435" stroke="#444" stroke-width="1"/>
  <text x="640" y="448" text-anchor="middle" class="tick">125</text>

  <!-- Sweet spot zone -->
  <rect x="300" y="110" width="200" height="110" rx="10" fill="#22c55e" opacity="0.06" stroke="#22c55e" stroke-opacity="0.15" stroke-dasharray="4,3"/>
  <text x="400" y="208" text-anchor="middle" class="sweet-label">Sweet spot</text>

  <!-- Background models (gray dots) -->
  <circle cx="210" cy="172" r="7" fill="#555" opacity="0.4"/>
  <circle cx="220" cy="180" r="8" fill="#555" opacity="0.4"/>
  <circle cx="240" cy="192" r="7" fill="#555" opacity="0.4"/>
  <circle cx="230" cy="185" r="6" fill="#555" opacity="0.4"/>
  <circle cx="180" cy="188" r="9" fill="#555" opacity="0.4"/>
  <circle cx="150" cy="193" r="7" fill="#555" opacity="0.4"/>
  <circle cx="188" cy="210" r="6" fill="#555" opacity="0.4"/>
  <circle cx="540" cy="240" r="5" fill="#555" opacity="0.4"/>
  <circle cx="200" cy="255" r="6" fill="#555" opacity="0.4"/>
  <circle cx="300" cy="242" r="7" fill="#555" opacity="0.4"/>
  <circle cx="160" cy="310" r="7" fill="#555" opacity="0.4"/>

  <!-- Qwen3.5 122B MoE MLX (top performer) -->
  <circle cx="266" cy="90" r="14" fill="#22c55e" opacity="0.8" stroke="#22c55e" stroke-width="2" stroke-opacity="0.5"/>
  <text x="288" y="82" class="model-name" fill="#86efac">Qwen3.5 122B MoE (MLX)</text>
  <text x="288" y="98" class="model-detail">1.00 avg · 46.6 tok/s</text>

  <!-- Qwen3.5 122B MoE GGUF -->
  <circle cx="182" cy="90" r="12" fill="#22c55e" opacity="0.6" stroke="#22c55e" stroke-width="1.5" stroke-opacity="0.4"/>
  <text x="110" y="80" class="model-name" fill="#86efac">GGUF</text>
  <text x="110" y="96" class="model-detail">25.4 tok/s</text>

  <!-- Qwen2.5 VL 7B (efficiency winner) -->
  <circle cx="370" cy="160" r="10" fill="#4a9eed" opacity="0.8" stroke="#4a9eed" stroke-width="2" stroke-opacity="0.5"/>
  <text x="388" y="148" class="model-name" fill="#93c5fd">Qwen2.5 VL 7B</text>
  <text x="388" y="164" class="model-detail">0.90 · 69.8 tok/s · 4.8 GB</text>

  <!-- GPT-OSS 120B (fast + accurate) -->
  <circle cx="360" cy="185" r="11" fill="#f59e0b" opacity="0.5" stroke="#f59e0b" stroke-width="1.5" stroke-opacity="0.5"/>
  <text x="378" y="195" class="model-name" fill="#fcd34d">GPT-OSS 120B</text>
  <text x="378" y="210" class="model-detail">0.89 · 68.0 tok/s</text>

  <!-- DeepSeek Coder V2 Lite (speed demon) -->
  <circle cx="590" cy="243" r="8" fill="#ec4899" opacity="0.8" stroke="#ec4899" stroke-width="1.5" stroke-opacity="0.5"/>
  <text x="530" y="233" class="model-name" fill="#f9a8d4" text-anchor="end">DeepSeek V2 Lite</text>
  <text x="530" y="249" class="model-detail" text-anchor="end">0.83 · 127 tok/s</text>

  <!-- Qwen3 4B (fastest, smallest) -->
  <circle cx="655" cy="362" r="7" fill="#ec4899" opacity="0.8" stroke="#ec4899" stroke-width="2" stroke-opacity="0.5"/>
  <text x="600" y="352" class="model-name" fill="#f9a8d4" text-anchor="end">Qwen3 4B</text>
  <text x="600" y="368" class="model-detail" text-anchor="end">0.69 · 145 tok/s · 2.3 GB</text>

  <!-- Llama 3.3 70B (large, slow) -->
  <circle cx="112" cy="200" r="12" fill="#f59e0b" opacity="0.4" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.4"/>
  <text x="100" y="222" class="model-name" fill="#fcd34d">Llama 3.3 70B</text>
  <text x="100" y="238" class="model-detail">0.86 · 7.5 tok/s · 39.7 GB</text>

  <!-- MiniMax 229B -->
  <circle cx="255" cy="260" r="14" fill="#f59e0b" opacity="0.35" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.3"/>
  <text x="275" y="270" class="model-name" fill="#fcd34d">MiniMax 229B</text>
  <text x="275" y="286" class="model-detail">0.82 · 38.3 tok/s · 101 GB</text>

  <!-- Legend -->
  <rect x="560" y="80" width="170" height="120" rx="8" fill="#1e1e2e" stroke="#333" stroke-width="1"/>
  <text x="575" y="98" class="legend-text" fill="#a0a0a0">Bubble = model size</text>
  <circle cx="580" cy="114" r="5" fill="#22c55e" opacity="0.8"/>
  <text x="592" y="118" class="legend-text">Top performer</text>
  <circle cx="580" cy="136" r="5" fill="#4a9eed" opacity="0.8"/>
  <text x="592" y="140" class="legend-text">Best efficiency</text>
  <circle cx="580" cy="158" r="5" fill="#ec4899" opacity="0.8"/>
  <text x="592" y="162" class="legend-text">Speed leaders</text>
  <circle cx="580" cy="180" r="5" fill="#555" opacity="0.5"/>
  <text x="592" y="184" class="legend-text">Other models</text>
</svg>