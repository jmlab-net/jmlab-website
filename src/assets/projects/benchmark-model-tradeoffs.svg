  <line x1="438" y1="189" x2="421" y2="147" stroke="#555" stroke-width="1" stroke-dasharray="3,3" opacity="0.4"/>
  <line x1="751" y1="424" x2="839" y2="370" stroke="#555" stroke-width="1" stroke-dasharray="3,3" opacity="0.4"/>

  <!-- Legend (top-right, inside plot area) -->
