<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" fill="none">
  <style>
    text { font-family: 'Segoe UI', system-ui, sans-serif; }
    .title { font-size: 22px; font-weight: 700; fill: #e5e5e5; }
    .subtitle { font-size: 13px; fill: #a0a0a0; }
    .axis-label { font-size: 13px; font-weight: 600; fill: #a0a0a0; }
    .tick { font-size: 11px; fill: #757575; }
    .model-name { font-size: 12px; font-weight: 600; }
    .model-detail { font-size: 11px; fill: #a0a0a0; }
    .legend-text { font-size: 11px; fill: #a0a0a0; }
    .sweet-label { font-size: 11px; font-weight: 500; fill: #22c55e; opacity: 0.8; }
  </style>

  <!-- Background -->
  <rect width="760" height="520" rx="12" fill="#141419"/>

  <!-- Title -->
  <text x="380" y="35" text-anchor="middle" class="title">Model Performance Tradeoffs</text>
  <text x="380" y="55" text-anchor="middle" class="subtitle">24 Models · Size vs Speed vs Accuracy</text>

  <!-- Y Axis -->
  <line x1="80" y1="80" x2="80" y2="430" stroke="#333" stroke-width="1.5"/>
  <text x="35" y="260" text-anchor="middle" class="axis-label" transform="rotate(-90, 35, 260)">Accuracy</text>

  <!-- Y ticks -->
  <line x1="75" y1="105" x2="85" y2="105" stroke="#444" stroke-width="1"/>
  <text x="65" y="109" text-anchor="end" class="tick">98%</text>
  <line x1="80" y1="105" x2="690" y2="105" stroke="#333" stroke-width="0.5" stroke-dasharray="4,4" opacity="0.3"/>

  <line x1="75" y1="185" x2="85" y2="185" stroke="#444" stroke-width="1"/>
  <text x="65" y="189" text-anchor="end" class="tick">90%</text>
  <line x1="80" y1="185" x2="690" y2="185" stroke="#333" stroke-width="0.5" stroke-dasharray="4,4" opacity="0.3"/>

  <line x1="75" y1="285" x2="85" y2="285" stroke="#444" stroke-width="1"/>
  <text x="65" y="289" text-anchor="end" class="tick">80%</text>
  <line x1="80" y1="285" x2="690" y2="285" stroke="#333" stroke-width="0.5" stroke-dasharray="4,4" opacity="0.3"/>

  <line x1="75" y1="385" x2="85" y2="385" stroke="#444" stroke-width="1"/>
  <text x="65" y="389" text-anchor="end" class="tick">70%</text>

  <!-- X Axis -->
  <line x1="80" y1="430" x2="700" y2="430" stroke="#333" stroke-width="1.5"/>
  <text x="390" y="470" text-anchor="middle" class="axis-label">Tokens / sec (Speed)</text>

  <!-- X ticks -->
  <line x1="145" y1="425" x2="145" y2="435" stroke="#444" stroke-width="1"/>
  <text x="145" y="448" text-anchor="middle" class="tick">46</text>

  <line x1="300" y1="425" x2="300" y2="435" stroke="#444" stroke-width="1"/>
  <text x="300" y="448" text-anchor="middle" class="tick">70</text>

  <line x1="490" y1="425" x2="490" y2="435" stroke="#444" stroke-width="1"/>
  <text x="490" y="448" text-anchor="middle" class="tick">100</text>

  <line x1="650" y1="425" x2="650" y2="435" stroke="#444" stroke-width="1"/>
  <text x="650" y="448" text-anchor="middle" class="tick">143</text>

  <!-- Sweet spot zone -->
  <rect x="250" y="130" width="160" height="110" rx="10" fill="#22c55e" opacity="0.06" stroke="#22c55e" stroke-opacity="0.15" stroke-dasharray="4,3"/>
  <text x="330" y="228" text-anchor="middle" class="sweet-label">Sweet spot</text>

  <!-- Background models (gray dots) -->
  <circle cx="200" cy="160" r="8" fill="#555" opacity="0.4"/>
  <circle cx="380" cy="250" r="7" fill="#555" opacity="0.4"/>
  <circle cx="260" cy="280" r="7" fill="#555" opacity="0.4"/>
  <circle cx="440" cy="230" r="6" fill="#555" opacity="0.4"/>
  <circle cx="180" cy="210" r="9" fill="#555" opacity="0.4"/>
  <circle cx="520" cy="300" r="6" fill="#555" opacity="0.4"/>
  <circle cx="340" cy="190" r="7" fill="#555" opacity="0.4"/>
  <circle cx="420" cy="320" r="6" fill="#555" opacity="0.4"/>
  <circle cx="570" cy="350" r="5" fill="#555" opacity="0.4"/>
  <circle cx="160" cy="180" r="8" fill="#555" opacity="0.4"/>
  <circle cx="230" cy="240" r="7" fill="#555" opacity="0.4"/>
  <circle cx="350" cy="270" r="6" fill="#555" opacity="0.4"/>
  <circle cx="480" cy="280" r="6" fill="#555" opacity="0.4"/>
  <circle cx="140" cy="200" r="9" fill="#555" opacity="0.4"/>
  <circle cx="310" cy="220" r="7" fill="#555" opacity="0.4"/>
  <circle cx="550" cy="330" r="5" fill="#555" opacity="0.4"/>
  <circle cx="460" cy="260" r="6" fill="#555" opacity="0.4"/>
  <circle cx="220" cy="170" r="8" fill="#555" opacity="0.4"/>
  <circle cx="400" cy="290" r="6" fill="#555" opacity="0.4"/>
  <circle cx="500" cy="310" r="5" fill="#555" opacity="0.4"/>

  <!-- Nemotron (top performer) -->
  <circle cx="145" cy="100" r="16" fill="#22c55e" opacity="0.8" stroke="#22c55e" stroke-width="2" stroke-opacity="0.5"/>
  <text x="170" y="92" class="model-name" fill="#86efac">Nemotron 120B</text>
  <text x="170" y="108" class="model-detail">0.984 avg · 101GB</text>

  <!-- Qwen2.5 VL 7B (efficiency winner) -->
  <circle cx="300" cy="175" r="11" fill="#4a9eed" opacity="0.8" stroke="#4a9eed" stroke-width="2" stroke-opacity="0.5"/>
  <text x="318" y="164" class="model-name" fill="#93c5fd">Qwen2.5 VL 7B</text>
  <text x="318" y="180" class="model-detail">90% · 70 tok/s · tiny!</text>

  <!-- MiniMax (large, slow) -->
  <circle cx="145" cy="230" r="18" fill="#f59e0b" opacity="0.5" stroke="#f59e0b" stroke-width="1.5" stroke-opacity="0.5"/>
  <text x="170" y="260" class="model-name" fill="#fcd34d">MiniMax 229B</text>
  <text x="170" y="276" class="model-detail">46 tok/s · 101GB</text>

  <!-- Qwen3 4B (fastest, smallest) -->
  <circle cx="650" cy="360" r="8" fill="#ec4899" opacity="0.8" stroke="#ec4899" stroke-width="2" stroke-opacity="0.5"/>
  <text x="595" y="348" class="model-name" fill="#f9a8d4" text-anchor="end">Qwen3 4B</text>
  <text x="595" y="364" class="model-detail" text-anchor="end">143 tok/s · 2.3GB</text>

  <!-- Legend -->
  <rect x="560" y="80" width="170" height="110" rx="8" fill="#1e1e2e" stroke="#333" stroke-width="1"/>
  <text x="575" y="98" class="legend-text" fill="#a0a0a0">Bubble = model size</text>

  <circle cx="580" cy="114" r="5" fill="#22c55e" opacity="0.8"/>
  <text x="592" y="118" class="legend-text">Top performer</text>

  <circle cx="580" cy="136" r="5" fill="#4a9eed" opacity="0.8"/>
  <text x="592" y="140" class="legend-text">Best efficiency</text>

  <circle cx="580" cy="158" r="5" fill="#f59e0b" opacity="0.6"/>
  <text x="592" y="162" class="legend-text">Largest model</text>

  <circle cx="580" cy="178" r="4" fill="#555" opacity="0.5"/>
  <text x="592" y="182" class="legend-text">Other models</text>
</svg>