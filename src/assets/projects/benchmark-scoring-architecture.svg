<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" fill="none">
  <style>
    text { font-family: 'Segoe UI', system-ui, sans-serif; }
    .title { font-size: 22px; font-weight: 700; fill: #e5e5e5; }
    .subtitle { font-size: 13px; fill: #a0a0a0; }
    .zone-label { font-size: 13px; font-weight: 600; }
    .zone-sub { font-size: 11px; fill: #a0a0a0; }
    .box-label { font-size: 13px; font-weight: 500; fill: #1e1e1e; }
    .box-label-sm { font-size: 11px; fill: #1e1e1e; }
    .dim-label { font-size: 12px; font-weight: 500; fill: #1e1e1e; }
    .arrow-label { font-size: 11px; fill: #a0a0a0; }
    .insight { font-size: 13px; font-weight: 500; fill: #fca5a5; }
    .score { font-size: 14px; font-weight: 600; }
  </style>

  <!-- Background -->
  <rect width="760" height="560" rx="12" fill="#141419"/>

  <!-- Title -->
  <text x="380" y="35" text-anchor="middle" class="title">Two-Layer Scoring Architecture</text>
  <text x="380" y="55" text-anchor="middle" class="subtitle">Every response scored twice, independently</text>

  <!-- Model Response -->
  <rect x="280" y="75" width="200" height="45" rx="8" fill="#4a9eed" opacity="0.85"/>
  <text x="380" y="103" text-anchor="middle" class="box-label">Model Response</text>

  <!-- Fork arrows -->
  <line x1="330" y1="120" x2="200" y2="160" stroke="#f59e0b" stroke-width="1.5" stroke-opacity="0.7" marker-end="url(#arrow-amber)"/>
  <line x1="430" y1="120" x2="560" y2="160" stroke="#8b5cf6" stroke-width="1.5" stroke-opacity="0.7" marker-end="url(#arrow-purple)"/>

  <!-- Layer 1 Zone -->
  <rect x="25" y="160" width="330" height="260" rx="10" fill="#f59e0b" opacity="0.08" stroke="#f59e0b" stroke-opacity="0.25"/>
  <text x="40" y="180" class="zone-label" fill="#f59e0b">Layer 1: Automated Pass/Fail</text>
  <text x="40" y="196" class="zone-sub">Self-assessment by model under test</text>

  <rect x="45" y="212" width="140" height="42" rx="6" fill="#f59e0b" opacity="0.6"/>
  <text x="115" y="230" text-anchor="middle" class="box-label-sm">GSM8K</text>
  <text x="115" y="246" text-anchor="middle" class="box-label-sm">Regex extract</text>

  <rect x="195" y="212" width="140" height="42" rx="6" fill="#f59e0b" opacity="0.6"/>
  <text x="265" y="230" text-anchor="middle" class="box-label-sm">HumanEval</text>
  <text x="265" y="246" text-anchor="middle" class="box-label-sm">Code execution</text>

  <rect x="45" y="264" width="140" height="42" rx="6" fill="#f59e0b" opacity="0.6"/>
  <text x="115" y="282" text-anchor="middle" class="box-label-sm">MMLU</text>
  <text x="115" y="298" text-anchor="middle" class="box-label-sm">Letter matching</text>

  <rect x="195" y="264" width="140" height="42" rx="6" fill="#f59e0b" opacity="0.6"/>
  <text x="265" y="282" text-anchor="middle" class="box-label-sm">IFEval</text>
  <text x="265" y="298" text-anchor="middle" class="box-label-sm">Constraint check</text>

  <!-- Pass/Fail result -->
  <ellipse cx="190" cy="365" rx="65" ry="25" fill="#f59e0b" opacity="0.5" stroke="#f59e0b" stroke-opacity="0.6"/>
  <text x="190" y="370" text-anchor="middle" class="score" fill="#1e1e1e">Pass / Fail</text>

  <line x1="120" y1="306" x2="170" y2="340" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.5" marker-end="url(#arrow-amber-sm)"/>
  <line x1="260" y1="306" x2="210" y2="340" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.5" marker-end="url(#arrow-amber-sm)"/>

  <!-- Layer 2 Zone -->
  <rect x="405" y="160" width="330" height="260" rx="10" fill="#8b5cf6" opacity="0.08" stroke="#8b5cf6" stroke-opacity="0.25"/>
  <text x="420" y="180" class="zone-label" fill="#8b5cf6">Layer 2: Independent Rubric Review</text>
  <text x="420" y="196" class="zone-sub">Reviewed by Claude Code (API)</text>

  <rect x="425" y="215" width="130" height="34" rx="6" fill="#8b5cf6" opacity="0.5"/>
  <text x="490" y="237" text-anchor="middle" class="dim-label">Accuracy</text>

  <rect x="565" y="215" width="130" height="34" rx="6" fill="#8b5cf6" opacity="0.5"/>
  <text x="630" y="237" text-anchor="middle" class="dim-label">Reasoning</text>

  <rect x="425" y="259" width="130" height="34" rx="6" fill="#8b5cf6" opacity="0.5"/>
  <text x="490" y="281" text-anchor="middle" class="dim-label">Adherence</text>

  <rect x="565" y="259" width="130" height="34" rx="6" fill="#8b5cf6" opacity="0.5"/>
  <text x="630" y="281" text-anchor="middle" class="dim-label">Conciseness</text>

  <rect x="495" y="303" width="130" height="34" rx="6" fill="#8b5cf6" opacity="0.5"/>
  <text x="560" y="325" text-anchor="middle" class="dim-label">Confidence</text>

  <text x="560" y="355" text-anchor="middle" class="zone-sub">Each: 1-3 scale</text>

  <!-- Score /15 result -->
  <ellipse cx="560" cy="385" rx="60" ry="25" fill="#8b5cf6" opacity="0.4" stroke="#8b5cf6" stroke-opacity="0.5"/>
  <text x="560" y="390" text-anchor="middle" class="score" fill="#e5e5e5">Score / 15</text>

  <!-- Converge to DB -->
  <line x1="210" y1="390" x2="330" y2="455" stroke="#f59e0b" stroke-width="1.5" stroke-opacity="0.5" marker-end="url(#arrow-amber)"/>
  <line x1="540" y1="410" x2="420" y2="455" stroke="#8b5cf6" stroke-width="1.5" stroke-opacity="0.5" marker-end="url(#arrow-purple)"/>

  <!-- PostgreSQL -->
  <rect x="290" y="455" width="180" height="45" rx="8" fill="#22c55e" opacity="0.25" stroke="#22c55e" stroke-opacity="0.4"/>
  <text x="380" y="483" text-anchor="middle" class="box-label" fill="#86efac">PostgreSQL</text>

  <!-- Insight callout -->
  <rect x="145" y="518" width="470" height="30" rx="6" fill="#ef4444" opacity="0.1" stroke="#ef4444" stroke-opacity="0.25"/>
  <text x="380" y="538" text-anchor="middle" class="insight">Catches correct answers produced through flawed reasoning</text>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrow-amber" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5" fill="#f59e0b" opacity="0.7"/>
    </marker>
    <marker id="arrow-amber-sm" markerWidth="6" markerHeight="4" refX="6" refY="2" orient="auto">
      <path d="M0,0 L6,2 L0,4" fill="#f59e0b" opacity="0.5"/>
    </marker>
    <marker id="arrow-purple" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5" fill="#8b5cf6" opacity="0.7"/>
    </marker>
  </defs>
</svg>