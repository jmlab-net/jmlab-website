<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 220" fill="none">
  <style>
    text { font-family: 'Segoe UI', system-ui, sans-serif; }
    .title { font-size: 18px; font-weight: 700; fill: #e5e5e5; }
    .sub { font-size: 11px; fill: #a0a0a0; }
    .box { font-size: 13px; font-weight: 500; fill: #1e1e1e; }
    .box-sm { font-size: 11px; fill: #1e1e1e; }
    .detail { font-size: 10px; fill: #757575; }
    .loop { font-size: 11px; fill: #757575; }
  </style>
  <rect width="1060" height="220" rx="10" fill="#141419"/>

  <!-- Step 1: SSH Load -->
  <rect x="20" y="40" width="100" height="55" rx="7" fill="#4a9eed" opacity="0.85"/>
  <text x="70" y="64" text-anchor="middle" class="box">SSH Load</text>
  <text x="70" y="80" text-anchor="middle" class="box-sm">Model</text>
  <text x="70" y="105" text-anchor="middle" class="detail">lms load &lt;id&gt;</text>

  <line x1="120" y1="67" x2="145" y2="67" stroke="#a0a0a0" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Step 2: Prompts -->
  <rect x="145" y="28" width="165" height="80" rx="7" fill="#8b5cf6" opacity="0.12" stroke="#8b5cf6" stroke-opacity="0.3"/>
  <text x="155" y="42" class="detail" fill="#8b5cf6">x20 prompts</text>
  <rect x="155" y="48" width="68" height="26" rx="5" fill="#8b5cf6" opacity="0.6"/>
  <text x="189" y="66" text-anchor="middle" class="box-sm">GSM8K</text>
  <rect x="229" y="48" width="72" height="26" rx="5" fill="#8b5cf6" opacity="0.6"/>
  <text x="265" y="66" text-anchor="middle" class="box-sm">HumanE</text>
  <rect x="155" y="78" width="68" height="26" rx="5" fill="#8b5cf6" opacity="0.6"/>
  <text x="189" y="96" text-anchor="middle" class="box-sm">MMLU</text>
  <rect x="229" y="78" width="72" height="26" rx="5" fill="#8b5cf6" opacity="0.6"/>
  <text x="265" y="96" text-anchor="middle" class="box-sm">IFEval</text>

  <line x1="310" y1="67" x2="335" y2="67" stroke="#a0a0a0" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Step 3: Auto Score (Layer 1 only) -->
  <rect x="335" y="35" width="120" height="65" rx="7" fill="#f59e0b" opacity="0.1" stroke="#f59e0b" stroke-opacity="0.3"/>
  <text x="345" y="50" class="detail" fill="#f59e0b">Layer 1</text>
  <rect x="345" y="56" width="100" height="32" rx="5" fill="#f59e0b" opacity="0.6"/>
  <text x="395" y="77" text-anchor="middle" class="box-sm">Auto Pass/Fail</text>

  <line x1="455" y1="67" x2="480" y2="67" stroke="#a0a0a0" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Step 4: Store -->
  <rect x="480" y="40" width="100" height="55" rx="7" fill="#22c55e" opacity="0.3" stroke="#22c55e" stroke-opacity="0.5"/>
  <text x="530" y="64" text-anchor="middle" class="box" fill="#86efac">Store in</text>
  <text x="530" y="80" text-anchor="middle" class="box" fill="#86efac">PostgreSQL</text>

  <line x1="580" y1="67" x2="605" y2="67" stroke="#a0a0a0" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Step 5: Notify -->
  <rect x="605" y="40" width="95" height="55" rx="7" fill="#ef4444" opacity="0.2" stroke="#ef4444" stroke-opacity="0.4"/>
  <text x="652" y="64" text-anchor="middle" class="box" fill="#fca5a5">Notify</text>
  <text x="652" y="80" text-anchor="middle" class="box" fill="#fca5a5">Mattermost</text>

  <line x1="700" y1="67" x2="725" y2="67" stroke="#a0a0a0" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Step 6: Unload -->
  <rect x="725" y="40" width="100" height="55" rx="7" fill="#4a9eed" opacity="0.85"/>
  <text x="775" y="64" text-anchor="middle" class="box">SSH Unload</text>
  <text x="775" y="80" text-anchor="middle" class="box-sm">Model</text>
  <text x="775" y="105" text-anchor="middle" class="detail">lms unload --all</text>

  <!-- Loop arrow (around steps 1-6) -->
  <path d="M775,95 L775,155 L70,155 L70,95" fill="none" stroke="#757575" stroke-width="1" stroke-dasharray="5,3" marker-end="url(#arr-dim)"/>
  <text x="420" y="170" text-anchor="middle" class="loop">Repeat for next model (26 total)</text>

  <line x1="825" y1="67" x2="850" y2="67" stroke="#a0a0a0" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Step 7: Rubric Review (after unload, separate process) -->
  <rect x="850" y="28" width="190" height="80" rx="7" fill="#8b5cf6" opacity="0.08" stroke="#8b5cf6" stroke-opacity="0.3"/>
  <text x="860" y="42" class="detail" fill="#8b5cf6">Layer 2 (post-run)</text>
  <rect x="860" y="48" width="170" height="24" rx="5" fill="#8b5cf6" opacity="0.5"/>
  <text x="945" y="65" text-anchor="middle" class="box-sm">Rubric Review /15</text>
  <rect x="860" y="78" width="170" height="24" rx="5" fill="#8b5cf6" opacity="0.5"/>
  <text x="945" y="95" text-anchor="middle" class="box-sm">Claude API</text>

  <defs>
    <marker id="arr" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5" fill="#a0a0a0"/>
    </marker>
    <marker id="arr-dim" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5" fill="#757575"/>
    </marker>
  </defs>
</svg>
