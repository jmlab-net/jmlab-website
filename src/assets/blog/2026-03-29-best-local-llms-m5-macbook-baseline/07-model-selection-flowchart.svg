<svg viewBox="0 0 1000 850" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1000" height="850" fill="#0f0f23"/>

  <!-- Title -->
  <text x="500" y="45" font-size="32" font-weight="bold" text-anchor="middle" fill="#ffffff">
    Model Selection Decision Tree
  </text>

  <!-- Start -->
  <g>
    <ellipse cx="500" cy="100" rx="60" ry="30" fill="#fbbf24" stroke="#b45309" stroke-width="2"/>
    <text x="500" y="108" font-size="13" font-weight="bold" text-anchor="middle" fill="#000">Start</text>
  </g>

  <!-- Arrow down -->
  <line x1="500" y1="130" x2="500" y2="160" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Question 1: How much memory? -->
  <g>
    <rect x="350" y="160" width="300" height="50" rx="6" fill="#1e3a8a" stroke="#3b82f6" stroke-width="2"/>
    <text x="500" y="190" font-size="13" font-weight="bold" text-anchor="middle" fill="#3b82f6">
      How much unified memory?
    </text>
  </g>

  <!-- 16 GB branch -->
  <g>
    <line x1="350" y1="210" x2="200" y2="260" stroke="#64748b" stroke-width="2"/>
    <text x="270" y="230" font-size="11" fill="#cbd5e1">16 GB</text>

    <rect x="70" y="260" width="260" height="50" rx="6" fill="#1a2563" stroke="#6366f1" stroke-width="2"/>
    <text x="200" y="290" font-size="13" font-weight="bold" text-anchor="middle" fill="#a5f3fc">
      16 GB: 7B models
    </text>

    <line x1="200" y1="310" x2="200" y2="340" stroke="#64748b" stroke-width="2"/>

    <rect x="70" y="340" width="260" height="70" rx="6" fill="#0f172a" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="200" y="360" font-size="12" font-weight="bold" text-anchor="middle" fill="#22d3ee">
      → Qwen2.5 VL 7B
    </text>
    <text x="200" y="380" font-size="10" text-anchor="middle" fill="#cbd5e1">
      69.8 tok/s • 0.90 acc
    </text>
    <text x="200" y="395" font-size="10" text-anchor="middle" fill="#cbd5e1">
      Alt: Qwen2.5 Coder 7B
    </text>
  </g>

  <!-- 32-64 GB branch -->
  <g>
    <line x1="500" y1="210" x2="500" y2="260" stroke="#64748b" stroke-width="2"/>
    <text x="520" y="230" font-size="11" fill="#cbd5e1">32–64 GB</text>

    <rect x="350" y="260" width="300" height="50" rx="6" fill="#1a3a52" stroke="#14b8a6" stroke-width="2"/>
    <text x="500" y="290" font-size="13" font-weight="bold" text-anchor="middle" fill="#2dd4bf">
      What matters most?
    </text>

    <!-- Accuracy branch -->
    <g>
      <line x1="350" y1="310" x2="300" y2="360" stroke="#64748b" stroke-width="2"/>
      <text x="320" y="330" font-size="11" fill="#cbd5e1">Accuracy</text>

      <rect x="180" y="360" width="240" height="70" rx="6" fill="#0f2e2e" stroke="#14b8a6" stroke-width="1.5"/>
      <text x="300" y="380" font-size="12" font-weight="bold" text-anchor="middle" fill="#2dd4bf">
        → Qwen2.5 Coder 32B
      </text>
      <text x="300" y="400" font-size="10" text-anchor="middle" fill="#cbd5e1">
        MLX • 18.3 GB • 0.91 acc
      </text>
      <text x="300" y="415" font-size="10" text-anchor="middle" fill="#cbd5e1">
        19.4 tok/s
      </text>
    </g>

    <!-- Speed branch -->
    <g>
      <line x1="650" y1="310" x2="700" y2="360" stroke="#64748b" stroke-width="2"/>
      <text x="680" y="330" font-size="11" fill="#cbd5e1">Speed</text>

      <rect x="580" y="360" width="240" height="70" rx="6" fill="#0f2e2e" stroke="#14b8a6" stroke-width="1.5"/>
      <text x="700" y="380" font-size="12" font-weight="bold" text-anchor="middle" fill="#2dd4bf">
        → Mistral Small 24B
      </text>
      <text x="700" y="400" font-size="10" text-anchor="middle" fill="#cbd5e1">
        MLX • 14.1 GB • 0.88 acc
      </text>
      <text x="700" y="415" font-size="10" text-anchor="middle" fill="#cbd5e1">
        28 tok/s
      </text>
    </g>
  </g>

  <!-- 128 GB branch -->
  <g>
    <line x1="650" y1="210" x2="800" y2="260" stroke="#64748b" stroke-width="2"/>
    <text x="730" y="230" font-size="11" fill="#cbd5e1">128 GB</text>

    <rect x="670" y="260" width="260" height="50" rx="6" fill="#3a1f5f" stroke="#d946ef" stroke-width="2"/>
    <text x="800" y="290" font-size="13" font-weight="bold" text-anchor="middle" fill="#f472b6">
      128 GB: 120B+ models
    </text>

    <line x1="800" y1="310" x2="800" y2="340" stroke="#64748b" stroke-width="2"/>

    <rect x="670" y="340" width="260" height="70" rx="6" fill="#2d1047" stroke="#f472b6" stroke-width="1.5"/>
    <text x="800" y="360" font-size="12" font-weight="bold" text-anchor="middle" fill="#f472b6">
      → Qwen3.5 122B MoE
    </text>
    <text x="800" y="380" font-size="10" text-anchor="middle" fill="#cbd5e1">
      43.7 tok/s • 1.00 acc ⭐
    </text>
    <text x="800" y="395" font-size="10" text-anchor="middle" fill="#cbd5e1">
      Alt: MiniMax 229B (max)
    </text>
  </g>

  <!-- Special cases box -->
  <rect x="50" y="480" width="900" height="330" rx="8" fill="#1e293b" stroke="#64748b" stroke-width="1"/>

  <text x="70" y="510" font-size="14" font-weight="bold" fill="#cbd5e1">Special Cases & Considerations</text>

  <!-- Format consideration -->
  <g>
    <text x="70" y="545" font-size="12" font-weight="bold" fill="#cbd5e1">Format (GGUF vs MLX):</text>

    <rect x="70" y="555" width="410" height="50" rx="4" fill="#0f172a" stroke="#0369a1" stroke-width="1"/>
    <text x="85" y="575" font-size="11" fill="#22d3ee">Try MLX first if available</text>
    <text x="85" y="591" font-size="11" fill="#cbd5e1">Switch to GGUF if slow</text>

    <rect x="510" y="555" width="410" height="50" rx="4" fill="#0f172a" stroke="#0369a1" stroke-width="1"/>
    <text x="525" y="575" font-size="11" fill="#22d3ee">MacBook Air: GGUF often wins</text>
    <text x="525" y="591" font-size="11" fill="#cbd5e1">M5 Pro/Max: MLX usually faster</text>
  </g>

  <!-- Context window consideration -->
  <g>
    <text x="70" y="635" font-size="12" font-weight="bold" fill="#cbd5e1">Context Length:</text>

    <rect x="70" y="645" width="410" height="50" rx="4" fill="#0f172a" stroke="#14b8a6" stroke-width="1"/>
    <text x="85" y="665" font-size="11" fill="#2dd4bf">Start with 8K context</text>
    <text x="85" y="681" font-size="11" fill="#cbd5e1">Bump to 16K/32K if needed</text>

    <rect x="510" y="645" width="410" height="50" rx="4" fill="#0f172a" stroke="#14b8a6" stroke-width="1"/>
    <text x="525" y="665" font-size="11" fill="#2dd4bf">Bigger model at 8K beats</text>
    <text x="525" y="681" font-size="11" fill="#cbd5e1">smaller model at 32K</text>
  </g>

  <!-- Temperature consideration -->
  <g>
    <text x="70" y="725" font-size="12" font-weight="bold" fill="#cbd5e1">Temperature Setting:</text>

    <rect x="70" y="735" width="850" height="50" rx="4" fill="#0f172a" stroke="#a855f7" stroke-width="1"/>
    <text x="85" y="755" font-size="11" fill="#c4b5fd">T=0.0 (math/code) • T=0.3 (default) • T=0.7 (creative)</text>
    <text x="85" y="771" font-size="11" fill="#cbd5e1">Top models (Qwen3.5, Nemotron) stay accurate even at high temps</text>
  </g>

  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <polygon points="0 0, 10 5, 0 10" fill="#64748b"/>
    </marker>
  </defs>
</svg>