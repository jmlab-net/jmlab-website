<svg viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1000" height="500" fill="#0f0f23"/>

  <!-- Title -->
  <text x="500" y="45" font-size="32" font-weight="bold" text-anchor="middle" fill="#ffffff">
    GGUF vs MLX: Format Comparison
  </text>

  <!-- GGUF Column -->
  <g>
    <!-- Header -->
    <rect x="50" y="80" width="400" height="50" rx="8" fill="#1e3a8a" stroke="#3b82f6" stroke-width="2"/>
    <text x="250" y="115" font-size="24" font-weight="bold" text-anchor="middle" fill="#3b82f6">
      GGUF
    </text>

    <!-- Wider availability -->
    <rect x="70" y="160" width="360" height="60" rx="6" fill="#0f172a" stroke="#0369a1" stroke-width="1"/>
    <text x="85" y="180" font-size="13" font-weight="bold" fill="#22d3ee">✓ Wider availability</text>
    <text x="85" y="200" font-size="12" fill="#cbd5e1">More models have GGUF variants</text>

    <!-- Performance variable -->
    <rect x="70" y="240" width="360" height="60" rx="6" fill="#0f172a" stroke="#0369a1" stroke-width="1"/>
    <text x="85" y="260" font-size="13" font-weight="bold" fill="#22d3ee">⚡ Performance variable</text>
    <text x="85" y="280" font-size="12" fill="#cbd5e1">5 of 11 models faster, some by 45%</text>

    <!-- Good on MacBook Air -->
    <rect x="70" y="320" width="360" height="60" rx="6" fill="#0f172a" stroke="#0369a1" stroke-width="1"/>
    <text x="85" y="340" font-size="13" font-weight="bold" fill="#22d3ee">💻 Prefer on MacBook Air</text>
    <text x="85" y="360" font-size="12" fill="#cbd5e1">Often outperforms MLX on lower bandwidth</text>

    <!-- Use case -->
    <rect x="70" y="400" width="360" height="60" rx="6" fill="#1e3a8a"/>
    <text x="250" y="425" font-size="12" text-anchor="middle" fill="#cbd5e1">When to use:</text>
    <text x="250" y="445" font-size="11" font-weight="bold" text-anchor="middle" fill="#60a5fa">If MLX feels slow or unavailable</text>
  </g>

  <!-- MLX Column -->
  <g>
    <!-- Header -->
    <rect x="550" y="80" width="400" height="50" rx="8" fill="#7c2d12" stroke="#f97316" stroke-width="2"/>
    <text x="750" y="115" font-size="24" font-weight="bold" text-anchor="middle" fill="#f97316">
      MLX
    </text>

    <!-- Generally faster on M5 Pro/Max -->
    <rect x="570" y="160" width="360" height="60" rx="6" fill="#1f0f0f" stroke="#c2410c" stroke-width="1"/>
    <text x="585" y="180" font-size="13" font-weight="bold" fill="#fb923c">⚡ Often faster on M5 Pro/Max</text>
    <text x="585" y="200" font-size="12" fill="#cbd5e1">6 of 11 models, up to 38% speedup</text>

    <!-- Apple Silicon native -->
    <rect x="570" y="240" width="360" height="60" rx="6" fill="#1f0f0f" stroke="#c2410c" stroke-width="1"/>
    <text x="585" y="260" font-size="13" font-weight="bold" fill="#fb923c">🎯 Apple Silicon native</text>
    <text x="585" y="280" font-size="12" fill="#cbd5e1">Optimized for unified memory architecture</text>

    <!-- Similar accuracy -->
    <rect x="570" y="320" width="360" height="60" rx="6" fill="#1f0f0f" stroke="#c2410c" stroke-width="1"/>
    <text x="585" y="340" font-size="13" font-weight="bold" fill="#fb923c">✓ Accuracy parity</text>
    <text x="585" y="360" font-size="12" fill="#cbd5e1">Within 1–3% of GGUF variants</text>

    <!-- Use case -->
    <rect x="570" y="400" width="360" height="60" rx="6" fill="#7c2d12"/>
    <text x="750" y="425" font-size="12" text-anchor="middle" fill="#cbd5e1">When to use:</text>
    <text x="750" y="445" font-size="11" font-weight="bold" text-anchor="middle" fill="#fed7aa">Try MLX first if available</text>
  </g>

  <!-- Recommendation banner -->
  <rect x="50" y="480" width="900" height="10" rx="5" fill="#fbbf24"/>
</svg>