<svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1000" height="600" fill="#0f0f23"/>

  <!-- Title -->
  <text x="500" y="40" font-size="32" font-weight="bold" text-anchor="middle" fill="#ffffff">
    Memory Tiers & Model Recommendations
  </text>

  <!-- Tier 1: 16 GB -->
  <g>
    <!-- Card background -->
    <rect x="50" y="100" width="250" height="450" rx="12" fill="#1a2563" stroke="#6366f1" stroke-width="2"/>

    <!-- Tier label -->
    <text x="175" y="145" font-size="20" font-weight="bold" text-anchor="middle" fill="#a5f3fc">
      16 GB
    </text>
    <text x="175" y="170" font-size="14" text-anchor="middle" fill="#94a3b8">
      MacBook Air M5
    </text>

    <!-- Model -->
    <rect x="65" y="190" width="220" height="50" rx="6" fill="#0f172a"/>
    <text x="175" y="210" font-size="13" font-weight="bold" text-anchor="middle" fill="#22d3ee">
      Qwen2.5 VL 7B
    </text>
    <text x="175" y="230" font-size="12" text-anchor="middle" fill="#cbd5e1">
      GGUF Q4_K_M • 4.8 GB
    </text>

    <!-- Stats -->
    <g>
      <text x="75" y="270" font-size="11" fill="#cbd5e1">Speed:</text>
      <text x="75" y="285" font-size="13" font-weight="bold" fill="#4ade80">69.8 tok/s</text>

      <text x="75" y="310" font-size="11" fill="#cbd5e1">Accuracy:</text>
      <text x="75" y="325" font-size="13" font-weight="bold" fill="#fbbf24">0.90</text>

      <text x="75" y="350" font-size="11" fill="#cbd5e1">Reserve:</text>
      <text x="75" y="365" font-size="13" font-weight="bold" fill="#f87171">8 GB OS</text>
    </g>

    <!-- Alternative -->
    <rect x="65" y="385" width="220" height="35" rx="6" fill="#2d1b4e" stroke="#a855f7" stroke-width="1" stroke-dasharray="2,2"/>
    <text x="175" y="405" font-size="11" text-anchor="middle" fill="#c4b5fd">
      Alt: Qwen2.5 Coder 7B (54 tok/s)
    </text>
  </g>

  <!-- Tier 2: 32-64 GB -->
  <g>
    <!-- Card background -->
    <rect x="375" y="100" width="250" height="450" rx="12" fill="#1a3a52" stroke="#14b8a6" stroke-width="2"/>

    <!-- Tier label -->
    <text x="500" y="145" font-size="20" font-weight="bold" text-anchor="middle" fill="#2dd4bf">
      32–64 GB
    </text>
    <text x="500" y="170" font-size="14" text-anchor="middle" fill="#94a3b8">
      M5 Pro / M5 Max
    </text>

    <!-- Top pick -->
    <rect x="390" y="190" width="220" height="50" rx="6" fill="#0f2e2e"/>
    <text x="500" y="210" font-size="13" font-weight="bold" text-anchor="middle" fill="#14b8a6">
      Qwen2.5 Coder 32B
    </text>
    <text x="500" y="230" font-size="12" text-anchor="middle" fill="#cbd5e1">
      MLX 4-bit • 18.3 GB
    </text>

    <!-- Stats -->
    <g>
      <text x="400" y="270" font-size="11" fill="#cbd5e1">Speed:</text>
      <text x="400" y="285" font-size="13" font-weight="bold" fill="#4ade80">19.4 tok/s</text>

      <text x="400" y="310" font-size="11" fill="#cbd5e1">Accuracy:</text>
      <text x="400" y="325" font-size="13" font-weight="bold" fill="#fbbf24">0.91</text>

      <text x="400" y="350" font-size="11" fill="#cbd5e1">For Speed:</text>
      <text x="400" y="365" font-size="13" font-weight="bold" fill="#4ade80">Mistral 24B (28 tok/s)</text>
    </g>

    <!-- At high end -->
    <rect x="390" y="385" width="220" height="35" rx="6" fill="#1e3a4a" stroke="#06b6d4" stroke-width="1" stroke-dasharray="2,2"/>
    <text x="500" y="405" font-size="11" text-anchor="middle" fill="#06b6d4">
      48–64 GB: Llama 3.3 70B (9 tok/s)
    </text>
  </g>

  <!-- Tier 3: 128 GB -->
  <g>
    <!-- Card background -->
    <rect x="700" y="100" width="250" height="450" rx="12" fill="#3a1f5f" stroke="#d946ef" stroke-width="2"/>

    <!-- Tier label -->
    <text x="825" y="145" font-size="20" font-weight="bold" text-anchor="middle" fill="#f472b6">
      128 GB
    </text>
    <text x="825" y="170" font-size="14" text-anchor="middle" fill="#94a3b8">
      M5 Max (top config)
    </text>

    <!-- Model -->
    <rect x="715" y="190" width="220" height="50" rx="6" fill="#2d1047"/>
    <text x="825" y="210" font-size="13" font-weight="bold" text-anchor="middle" fill="#f472b6">
      Qwen3.5 122B MoE
    </text>
    <text x="825" y="230" font-size="12" text-anchor="middle" fill="#cbd5e1">
      MLX 4-bit • 69.6 GB
    </text>

    <!-- Stats -->
    <g>
      <text x="725" y="270" font-size="11" fill="#cbd5e1">Speed:</text>
      <text x="725" y="285" font-size="13" font-weight="bold" fill="#4ade80">43.7 tok/s</text>

      <text x="725" y="310" font-size="11" fill="#cbd5e1">Accuracy:</text>
      <text x="725" y="325" font-size="13" font-weight="bold" fill="#fbbf24">1.00 ⭐</text>

      <text x="725" y="350" font-size="11" fill="#cbd5e1">Max Model:</text>
      <text x="725" y="365" font-size="13" font-weight="bold" fill="#f472b6">MiniMax 229B (45.7 tok/s)</text>
    </g>

    <!-- Free RAM note -->
    <rect x="715" y="385" width="220" height="35" rx="6" fill="#4a2c66" stroke="#f472b6" stroke-width="1" stroke-dasharray="2,2"/>
    <text x="825" y="405" font-size="11" text-anchor="middle" fill="#f0abfc">
      ✓ 40 GB free for OS & apps
    </text>
  </g>
</svg>