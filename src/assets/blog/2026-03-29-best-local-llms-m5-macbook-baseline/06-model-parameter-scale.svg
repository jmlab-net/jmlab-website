<svg viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1000" height="500" fill="#0f0f23"/>

  <!-- Title -->
  <text x="500" y="45" font-size="32" font-weight="bold" text-anchor="middle" fill="#ffffff">
    Model Size Scale: 7B to 229B Parameters
  </text>

  <!-- Scale bar -->
  <line x1="100" y1="120" x2="900" y2="120" stroke="#64748b" stroke-width="2"/>

  <!-- 0B marker -->
  <line x1="100" y1="115" x2="100" y2="125" stroke="#64748b" stroke-width="2"/>
  <text x="100" y="145" font-size="12" text-anchor="middle" fill="#94a3b8">0B</text>

  <!-- 50B marker -->
  <line x1="367" y1="115" x2="367" y2="125" stroke="#64748b" stroke-width="2"/>
  <text x="367" y="145" font-size="12" text-anchor="middle" fill="#94a3b8">50B</text>

  <!-- 100B marker -->
  <line x1="634" y1="115" x2="634" y2="125" stroke="#64748b" stroke-width="2"/>
  <text x="634" y="145" font-size="12" text-anchor="middle" fill="#94a3b8">100B</text>

  <!-- 150B marker -->
  <line x1="801" y1="115" x2="801" y2="125" stroke="#64748b" stroke-width="2"/>
  <text x="801" y="145" font-size="12" text-anchor="middle" fill="#94a3b8">150B</text>

  <!-- 200B marker -->
  <line x1="900" y1="115" x2="900" y2="125" stroke="#64748b" stroke-width="2"/>
  <text x="900" y="145" font-size="12" text-anchor="middle" fill="#94a3b8">250B</text>

  <!-- Models -->
  <!-- 7B models -->
  <g>
    <circle cx="136" cy="200" r="6" fill="#22d3ee" stroke="#0891b2" stroke-width="2"/>
    <text x="136" y="240" font-size="11" text-anchor="middle" fill="#22d3ee" font-weight="bold">7B</text>
    <text x="136" y="255" font-size="10" text-anchor="middle" fill="#cbd5e1">Qwen2.5 VL</text>

    <circle cx="168" cy="200" r="6" fill="#f97316" stroke="#c2410c" stroke-width="2"/>
    <text x="168" y="240" font-size="11" text-anchor="middle" fill="#f97316" font-weight="bold">7B Coder</text>
    <text x="168" y="255" font-size="10" text-anchor="middle" fill="#cbd5e1">Code-focused</text>
  </g>

  <!-- 14B model -->
  <g>
    <circle cx="200" cy="200" r="7" fill="#a78bfa" stroke="#7c3aed" stroke-width="2"/>
    <text x="200" y="242" font-size="11" text-anchor="middle" fill="#a78bfa" font-weight="bold">14B</text>
    <text x="200" y="257" font-size="10" text-anchor="middle" fill="#cbd5e1">Qwen2.5 (1M ctx)</text>
  </g>

  <!-- 24B models -->
  <g>
    <circle cx="248" cy="200" r="7" fill="#a78bfa" stroke="#7c3aed" stroke-width="2"/>
    <text x="248" y="242" font-size="11" text-anchor="middle" fill="#a78bfa" font-weight="bold">24B</text>
    <text x="248" y="257" font-size="10" text-anchor="middle" fill="#cbd5e1">Mistral Small</text>
  </g>

  <!-- 32B models -->
  <g>
    <circle cx="296" cy="200" r="8" fill="#14b8a6" stroke="#0f766e" stroke-width="2.5"/>
    <text x="296" y="245" font-size="12" text-anchor="middle" fill="#2dd4bf" font-weight="bold">32B</text>
    <text x="296" y="260" font-size="10" text-anchor="middle" fill="#cbd5e1">Qwen2.5 Coder</text>
    <text x="296" y="273" font-size="9" text-anchor="middle" fill="#cbd5e1">DeepSeek R1</text>
  </g>

  <!-- 70B model -->
  <g>
    <circle cx="428" cy="200" r="8" fill="#4ade80" stroke="#15803d" stroke-width="2"/>
    <text x="428" y="245" font-size="12" text-anchor="middle" fill="#4ade80" font-weight="bold">70B</text>
    <text x="428" y="260" font-size="10" text-anchor="middle" fill="#cbd5e1">Llama 3.3</text>
  </g>

  <!-- 120B+ models -->
  <g>
    <!-- Qwen3.5 122B -->
    <circle cx="562" cy="200" r="9" fill="#fbbf24" stroke="#b45309" stroke-width="2.5"/>
    <text x="562" y="247" font-size="12" text-anchor="middle" fill="#fbbf24" font-weight="bold">122B</text>
    <text x="562" y="262" font-size="9" text-anchor="middle" fill="#cbd5e1">Qwen3.5 MoE</text>
    <text x="562" y="274" font-size="9" text-anchor="middle" fill="#fbbf24">⭐ 1.00 acc</text>

    <!-- Nemotron 120B -->
    <circle cx="560" cy="320" r="8" fill="#f472b6" stroke="#be185d" stroke-width="2"/>
    <text x="560" y="365" font-size="11" text-anchor="middle" fill="#f472b6" font-weight="bold">Nemotron</text>
    <text x="560" y="378" font-size="9" text-anchor="middle" fill="#cbd5e1">0.98 accuracy</text>
  </g>

  <!-- MiniMax 229B -->
  <g>
    <circle cx="800" cy="200" r="9" fill="#f472b6" stroke="#be185d" stroke-width="2"/>
    <text x="800" y="247" font-size="12" text-anchor="middle" fill="#f472b6" font-weight="bold">229B</text>
    <text x="800" y="262" font-size="9" text-anchor="middle" fill="#cbd5e1">MiniMax M2.5</text>
    <text x="800" y="274" font-size="9" text-anchor="middle" fill="#f472b6">Largest model</text>
  </g>

  <!-- Bandwidth comparison box -->
  <rect x="50" y="380" width="900" height="95" rx="8" fill="#1e293b" stroke="#64748b" stroke-width="1"/>

  <text x="70" y="405" font-size="13" font-weight="bold" fill="#cbd5e1">Memory Bandwidth Impact:</text>

  <g font-size="12" fill="#94a3b8">
    <text x="70" y="428">• MacBook Air M5: 153 GB/s</text>
    <text x="70" y="448">• MacBook Pro M5: 192 GB/s</text>
    <text x="70" y="468">• MacBook Pro M5 Pro: 273 GB/s</text>

    <text x="500" y="428">• MacBook Pro M5 Max: 614 GB/s (4x Air)</text>
    <text x="500" y="448">Higher bandwidth = faster token generation, especially on large models (70B+)</text>
  </g>
</svg>