<svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1000" height="600" fill="#0f0f23"/>

  <!-- Title -->
  <text x="500" y="45" font-size="32" font-weight="bold" text-anchor="middle" fill="#ffffff">
    Temperature Settings: Precision vs Creativity
  </text>

  <!-- T=0.0 -->
  <g>
    <rect x="50" y="90" width="280" height="470" rx="12" fill="#1a2d4d" stroke="#0284c7" stroke-width="2"/>

    <text x="190" y="125" font-size="20" font-weight="bold" text-anchor="middle" fill="#0284c7">T = 0.0</text>
    <text x="190" y="145" font-size="13" text-anchor="middle" fill="#94a3b8">Deterministic</text>

    <!-- Description -->
    <rect x="65" y="165" width="250" height="60" rx="6" fill="#0f172a" stroke="#0369a1" stroke-width="1"/>
    <text x="75" y="185" font-size="12" font-weight="bold" fill="#22d3ee">Always same output</text>
    <text x="75" y="202" font-size="11" fill="#cbd5e1">Same input → same response</text>

    <!-- Use cases -->
    <text x="65" y="245" font-size="12" font-weight="bold" fill="#cbd5e1">Perfect for:</text>

    <rect x="65" y="255" width="250" height="50" rx="6" fill="#0f4c5e" border="1px solid #0369a1"/>
    <text x="75" y="275" font-size="11" fill="#cbd5e1">✓ Math problems</text>
    <text x="75" y="290" font-size="11" fill="#cbd5e1">✓ Code generation</text>

    <rect x="65" y="315" width="250" height="50" rx="6" fill="#0f4c5e"/>
    <text x="75" y="335" font-size="11" fill="#cbd5e1">✓ Factual lookups</text>
    <text x="75" y="350" font-size="11" fill="#cbd5e1">✓ Reproducible results</text>

    <rect x="65" y="375" width="250" height="50" rx="6" fill="#0f4c5e"/>
    <text x="75" y="395" font-size="11" fill="#cbd5e1">✓ Structured data</text>
    <text x="75" y="410" fill="#cbd5e1">✓ API responses</text>

    <!-- Example -->
    <rect x="65" y="435" width="250" height="85" rx="6" fill="#1a2d4d" stroke="#0284c7" stroke-width="1" stroke-dasharray="2,2"/>
    <text x="75" y="455" font-size="11" font-weight="bold" fill="#0284c7">Example:</text>
    <text x="75" y="473" font-size="10" fill="#cbd5e1" font-family="monospace">"2+2="</text>
    <text x="75" y="490" font-size="11" font-weight="bold" fill="#4ade80">→ Always "4"</text>
  </g>

  <!-- T=0.3 -->
  <g>
    <rect x="360" y="90" width="280" height="470" rx="12" fill="#1f3a2f" stroke="#14b8a6" stroke-width="2"/>

    <text x="500" y="125" font-size="20" font-weight="bold" text-anchor="middle" fill="#2dd4bf">T = 0.3</text>
    <text x="500" y="145" font-size="13" text-anchor="middle" fill="#94a3b8">Recommended Default</text>

    <!-- Description -->
    <rect x="375" y="165" width="250" height="60" rx="6" fill="#0f2e2e" stroke="#0f766e" stroke-width="1"/>
    <text x="385" y="185" font-size="12" font-weight="bold" fill="#22d3ee">Slight variation, stays reliable</text>
    <text x="385" y="202" font-size="11" fill="#cbd5e1">Phrasing varies, content consistent</text>

    <!-- Use cases -->
    <text x="375" y="245" font-size="12" font-weight="bold" fill="#cbd5e1">Perfect for:</text>

    <rect x="375" y="255" width="250" height="50" rx="6" fill="#0f3f3f"/>
    <text x="385" y="275" font-size="11" fill="#cbd5e1">✓ General chat</text>
    <text x="385" y="290" font-size="11" fill="#cbd5e1">✓ Writing & drafting</text>

    <rect x="375" y="315" width="250" height="50" rx="6" fill="#0f3f3f"/>
    <text x="385" y="335" font-size="11" fill="#cbd5e1">✓ Explanations</text>
    <text x="385" y="350" font-size="11" fill="#cbd5e1">✓ Most daily use</text>

    <rect x="375" y="375" width="250" height="50" rx="6" fill="#0f3f3f"/>
    <text x="385" y="395" font-size="11" fill="#cbd5e1">✓ Consistent quality</text>
    <text x="385" y="410" fill="#cbd5e1">✓ Balanced output</text>

    <!-- Example -->
    <rect x="375" y="435" width="250" height="85" rx="6" fill="#1f3a2f" stroke="#14b8a6" stroke-width="1" stroke-dasharray="2,2"/>
    <text x="385" y="455" font-size="11" font-weight="bold" fill="#2dd4bf">Example:</text>
    <text x="385" y="473" font-size="10" fill="#cbd5e1" font-family="monospace">"Explain loops"</text>
    <text x="385" y="490" font-size="11" font-weight="bold" fill="#4ade80">→ Similar, slightly different</text>
  </g>

  <!-- T=0.7 -->
  <g>
    <rect x="670" y="90" width="280" height="470" rx="12" fill="#4a2c66" stroke="#f472b6" stroke-width="2"/>

    <text x="810" y="125" font-size="20" font-weight="bold" text-anchor="middle" fill="#f472b6">T = 0.7</text>
    <text x="810" y="145" font-size="13" text-anchor="middle" fill="#94a3b8">Highly Creative</text>

    <!-- Description -->
    <rect x="685" y="165" width="250" height="60" rx="6" fill="#3a1a4d" stroke="#c084fc" stroke-width="1"/>
    <text x="695" y="185" font-size="12" font-weight="bold" fill="#e9d5ff">Much more variation</text>
    <text x="695" y="202" font-size="11" fill="#cbd5e1">Different outputs, some may be wrong</text>

    <!-- Use cases -->
    <text x="685" y="245" font-size="12" font-weight="bold" fill="#cbd5e1">Perfect for:</text>

    <rect x="685" y="255" width="250" height="50" rx="6" fill="#3d2463"/>
    <text x="695" y="275" font-size="11" fill="#cbd5e1">✓ Brainstorming</text>
    <text x="695" y="290" font-size="11" fill="#cbd5e1">✓ Creative writing</text>

    <rect x="685" y="315" width="250" height="50" rx="6" fill="#3d2463"/>
    <text x="695" y="335" font-size="11" fill="#cbd5e1">✓ Story ideas</text>
    <text x="695" y="350" font-size="11" fill="#cbd5e1">✓ Multiple variations</text>

    <rect x="685" y="375" width="250" height="50" rx="6" fill="#3d2463"/>
    <text x="695" y="395" font-size="11" fill="#cbd5e1">✓ Exploration</text>
    <text x="695" y="410" fill="#cbd5e1">✓ Less critical tasks</text>

    <!-- Warning -->
    <rect x="685" y="435" width="250" height="85" rx="6" fill="#4a2c66" stroke="#f472b6" stroke-width="1" stroke-dasharray="2,2"/>
    <text x="695" y="455" font-size="11" font-weight="bold" fill="#f472b6">⚠️ High-quality models</text>
    <text x="695" y="473" font-size="10" fill="#cbd5e1">stay accurate at T=0.7</text>
    <text x="695" y="493" font-size="10" fill="#cbd5e1">(Qwen3.5, Nemotron)</text>
  </g>
</svg>