<svg viewBox="0 0 1000 650" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1000" height="650" fill="#0f0f23"/>

  <!-- Title -->
  <text x="500" y="40" font-size="32" font-weight="bold" text-anchor="middle" fill="#ffffff">
    Speed vs Accuracy Trade-off
  </text>

  <!-- Grid background -->
  <defs>
    <pattern id="grid" width="60" height="48" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 48" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect x="80" y="80" width="840" height="480" fill="url(#grid)"/>

  <!-- Axes -->
  <line x1="80" y1="560" x2="920" y2="560" stroke="#64748b" stroke-width="2"/>
  <line x1="80" y1="560" x2="80" y2="80" stroke="#64748b" stroke-width="2"/>

  <!-- Axis labels -->
  <text x="500" y="600" font-size="14" font-weight="bold" text-anchor="middle" fill="#cbd5e1">
    Tokens per Second →
  </text>
  <text x="30" y="320" font-size="14" font-weight="bold" text-anchor="middle" fill="#cbd5e1" transform="rotate(-90 30 320)">
    Accuracy Score
  </text>

  <!-- Axis ticks and labels -->
  <g font-size="12" fill="#94a3b8">
    <!-- X-axis: 0, 25, 50, 75, 100+ tok/s -->
    <line x1="80" y1="560" x2="80" y2="568" stroke="#64748b" stroke-width="1.5"/>
    <text x="80" y="585" text-anchor="middle">0</text>

    <line x1="250" y1="560" x2="250" y2="568" stroke="#64748b" stroke-width="1.5"/>
    <text x="250" y="585" text-anchor="middle">25</text>

    <line x1="420" y1="560" x2="420" y2="568" stroke="#64748b" stroke-width="1.5"/>
    <text x="420" y="585" text-anchor="middle">50</text>

    <line x1="590" y1="560" x2="590" y2="568" stroke="#64748b" stroke-width="1.5"/>
    <text x="590" y="585" text-anchor="middle">75</text>

    <line x1="920" y1="560" x2="920" y2="568" stroke="#64748b" stroke-width="1.5"/>
    <text x="920" y="585" text-anchor="middle">100+</text>

    <!-- Y-axis: 0.80, 0.90, 1.00 -->
    <line x1="72" y1="500" x2="80" y2="500" stroke="#64748b" stroke-width="1.5"/>
    <text x="60" y="505" text-anchor="end">0.80</text>

    <line x1="72" y1="330" x2="80" y2="330" stroke="#64748b" stroke-width="1.5"/>
    <text x="60" y="335" text-anchor="end">0.90</text>

    <line x1="72" y1="160" x2="80" y2="160" stroke="#64748b" stroke-width="1.5"/>
    <text x="60" y="165" text-anchor="end">1.00</text>
  </g>

  <!-- Grid lines -->
  <line x1="80" y1="330" x2="920" y2="330" stroke="#1e293b" stroke-width="1" stroke-dasharray="4,4" opacity="0.5"/>
  <line x1="80" y1="160" x2="920" y2="160" stroke="#1e293b" stroke-width="1" stroke-dasharray="4,4" opacity="0.5"/>

  <!-- Data points (calculating positions based on actual data) -->
  <!-- 7B models (left side, high speed) -->
  <g>
    <!-- Qwen2.5 VL 7B: 69.8 tok/s, 0.90 accuracy -->
    <circle cx="432" cy="330" r="8" fill="#22d3ee" stroke="#0891b2" stroke-width="2"/>
    <text x="432" y="355" font-size="11" text-anchor="middle" fill="#22d3ee">Qwen2.5 VL 7B</text>

    <!-- DeepSeek Coder V2 Lite: ~135 tok/s, 0.83 accuracy -->
    <circle cx="795" cy="445" r="7" fill="#f97316" stroke="#c2410c" stroke-width="2"/>
    <text x="795" y="470" font-size="11" text-anchor="middle" fill="#f97316">DeepSeek Coder V2 Lite</text>

    <!-- Qwen2.5 Coder 7B: 54 tok/s, 0.83 accuracy -->
    <circle cx="367" cy="445" r="7" fill="#f97316" stroke="#c2410c" stroke-width="2"/>
  </g>

  <!-- 24B models (middle-left) -->
  <g>
    <!-- Mistral Small 24B MLX: 28 tok/s, 0.88 accuracy -->
    <circle cx="249" cy="388" r="8" fill="#a78bfa" stroke="#7c3aed" stroke-width="2"/>
    <text x="249" y="415" font-size="11" text-anchor="middle" fill="#a78bfa">Mistral Small 24B</text>
  </g>

  <!-- 32B models (middle) -->
  <g>
    <!-- Qwen2.5 Coder 32B: 19.4 tok/s, 0.91 accuracy -->
    <circle cx="180" cy="321" r="9" fill="#14b8a6" stroke="#0f766e" stroke-width="2.5"/>
    <text x="180" y="305" font-size="11" font-weight="bold" text-anchor="middle" fill="#2dd4bf">Qwen2.5 Coder 32B</text>

    <!-- DeepSeek R1 32B MLX: 12.5 tok/s, 0.91 accuracy -->
    <circle cx="138" cy="321" r="8" fill="#06b6d4" stroke="#0891b2" stroke-width="2"/>
    <text x="138" y="295" font-size="11" text-anchor="middle" fill="#06b6d4">DeepSeek R1 32B</text>
  </g>

  <!-- 70B models (middle-right, slower) -->
  <g>
    <!-- Llama 3.3 70B: 9 tok/s, 0.90 accuracy -->
    <circle cx="109" cy="330" r="8" fill="#4ade80" stroke="#15803d" stroke-width="2"/>
    <text x="109" y="365" font-size="11" text-anchor="middle" fill="#4ade80">Llama 3.3 70B</text>
  </g>

  <!-- 120B+ models (right side, varying speeds and high accuracy) -->
  <g>
    <!-- Qwen3.5 122B MoE: 43.7 tok/s, 1.00 accuracy -->
    <circle cx="339" cy="100" r="10" fill="#fbbf24" stroke="#b45309" stroke-width="2.5"/>
    <text x="339" y="65" font-size="12" font-weight="bold" text-anchor="middle" fill="#fbbf24">Qwen3.5 122B MoE ⭐</text>

    <!-- MiniMax M2.5 229B: 45.7 tok/s, 0.98 accuracy -->
    <circle cx="350" cy="150" r="9" fill="#f472b6" stroke="#be185d" stroke-width="2"/>
    <text x="350" y="185" font-size="11" text-anchor="middle" fill="#f472b6">MiniMax 229B</text>

    <!-- Nemotron 120B: 27.6 tok/s, 0.98 accuracy -->
    <circle cx="241" cy="160" r="8" fill="#f472b6" stroke="#be185d" stroke-width="2"/>
    <text x="241" y="195" font-size="11" text-anchor="middle" fill="#f472b6">Nemotron 120B</text>
  </g>

  <!-- Legend -->
  <g font-size="12" fill="#cbd5e1">
    <rect x="50" y="615" width="900" height="30" rx="6" fill="#1e293b" opacity="0.6"/>
    <text x="70" y="635" fill="#94a3b8">●</text>
    <text x="90" y="635">Smaller models (7B–24B) excel at speed</text>

    <text x="450" y="635" fill="#94a3b8">●</text>
    <text x="470" y="635">Larger models (70B+) maximize accuracy</text>
  </g>
</svg>