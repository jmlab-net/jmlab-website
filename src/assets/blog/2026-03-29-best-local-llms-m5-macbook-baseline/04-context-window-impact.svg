<svg viewBox="0 0 1000 550" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1000" height="550" fill="#0f0f23"/>

  <!-- Title -->
  <text x="500" y="45" font-size="32" font-weight="bold" text-anchor="middle" fill="#ffffff">
    Context Window Impact
  </text>

  <!-- Left column: Context sizes -->
  <g>
    <text x="50" y="110" font-size="16" font-weight="bold" fill="#cbd5e1">Recommended Context Lengths</text>

    <!-- 4K-8K -->
    <rect x="50" y="130" width="350" height="90" rx="8" fill="#1e3a1f" stroke="#4ade80" stroke-width="2"/>
    <text x="70" y="155" font-size="16" font-weight="bold" fill="#4ade80">4K–8K Context</text>
    <text x="70" y="175" font-size="12" fill="#cbd5e1">✓ Best speed & responsiveness</text>
    <text x="70" y="190" fill="#cbd5e1">✓ Covers chat, code completion</text>
    <text x="70" y="205" fill="#cbd5e1">✓ Default recommendation</text>

    <!-- 16K-32K -->
    <rect x="50" y="240" width="350" height="90" rx="8" fill="#1a3a52" stroke="#14b8a6" stroke-width="2"/>
    <text x="70" y="265" font-size="16" font-weight="bold" fill="#2dd4bf">16K–32K Context</text>
    <text x="70" y="285" fill="#cbd5e1">✓ Long documents, file analysis</text>
    <text x="70" y="300" fill="#cbd5e1">✓ Extended conversations</text>
    <text x="70" y="315" fill="#cbd5e1">✓ Trade-off: 4–8 GB more memory</text>

    <!-- 1M -->
    <rect x="50" y="350" width="350" height="90" rx="8" fill="#3a1f5f" stroke="#d946ef" stroke-width="2" stroke-dasharray="4,4"/>
    <text x="70" y="375" font-size="16" font-weight="bold" fill="#f472b6">1M Context (Extreme)</text>
    <text x="70" y="395" fill="#cbd5e1">• Qwen2.5 14B only</text>
    <text x="70" y="410" fill="#cbd5e1">• Severe speed penalty</text>
    <text x="70" y="425" fill="#cbd5e1">• For edge cases only</text>
  </g>

  <!-- Right column: Memory overhead visual -->
  <g>
    <text x="500" y="110" font-size="16" font-weight="bold" fill="#cbd5e1">Memory Overhead Example</text>
    <text x="500" y="130" font-size="12" fill="#94a3b8">(70B model, MLX 4-bit)</text>

    <!-- Base model -->
    <g>
      <text x="500" y="165" font-size="12" fill="#cbd5e1">Base model:</text>
      <rect x="500" y="175" width="300" height="30" rx="4" fill="#1e293b" stroke="#64748b" stroke-width="1"/>
      <text x="515" y="197" font-size="13" font-weight="bold" fill="#4ade80">39.7 GB</text>
    </g>

    <!-- 8K context -->
    <g>
      <text x="500" y="235" font-size="12" fill="#cbd5e1">8K context:</text>
      <rect x="500" y="245" width="300" height="30" rx="4" fill="#1a3a1f" stroke="#4ade80" stroke-width="1"/>
      <text x="515" y="267" font-size="13" font-weight="bold" fill="#4ade80">40.5 GB</text>
    </g>

    <!-- 16K context -->
    <g>
      <text x="500" y="305" font-size="12" fill="#cbd5e1">16K context:</text>
      <rect x="500" y="315" width="330" height="30" rx="4" fill="#1a3a52" stroke="#14b8a6" stroke-width="1"/>
      <text x="515" y="337" font-size="13" font-weight="bold" fill="#2dd4bf">43.2 GB</text>
    </g>

    <!-- 32K context -->
    <g>
      <text x="500" y="375" font-size="12" fill="#cbd5e1">32K context:</text>
      <rect x="500" y="385" width="360" height="30" rx="4" fill="#1a3a52" stroke="#14b8a6" stroke-width="1"/>
      <text x="515" y="407" font-size="13" font-weight="bold" fill="#2dd4bf">46.9 GB</text>
    </g>

    <!-- Rule of thumb -->
    <rect x="500" y="445" width="350" height="70" rx="6" fill="#2d1b4e" stroke="#a855f7" stroke-width="2"/>
    <text x="515" y="465" font-size="12" font-weight="bold" fill="#c4b5fd">Rule of Thumb:</text>
    <text x="515" y="483" font-size="11" fill="#cbd5e1">Double context = ~2–4 GB more</text>
    <text x="515" y="500" font-size="11" fill="#cbd5e1">Bigger model at 8K usually beats</text>
    <text x="515" y="515" font-size="11" fill="#cbd5e1">smaller model at 32K</text>
  </g>
</svg>