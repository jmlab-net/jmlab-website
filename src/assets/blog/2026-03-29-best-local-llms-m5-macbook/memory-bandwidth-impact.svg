<svg viewBox="0 0 960 365" xmlns="http://www.w3.org/2000/svg" fill="none">
  <defs>
    <style>
      text { font-family: 'Segoe UI', system-ui, sans-serif; }
      .title    { font-size: 20px; font-weight: 700; fill: #E5E5E5; }
      .subtitle { font-size: 13px; fill: #A0A0A0; }
      .label    { font-size: 12px; font-weight: 600; fill: #E5E5E5; }
      .axis-label { font-size: 13px; font-weight: 600; fill: #A0A0A0; }
      .tick     { font-size: 11px; fill: #757575; }
      .caption  { font-size: 10px; fill: #757575; }
      .badge    { font-size: 10px; font-weight: 700; }
    </style>
  </defs>

  <!-- Dark background -->
  <rect width="960" height="365" fill="#141419" rx="12"/>

  <!-- Title and subtitle -->
  <text x="480" y="30" text-anchor="middle" class="title">Memory Bandwidth: Why Chip Choice Matters</text>
  <text x="480" y="48" text-anchor="middle" class="subtitle">M5 unified memory bandwidth directly affects token generation speed</text>

  <!-- Y-axis line -->
  <line x1="80" y1="70" x2="80" y2="260" stroke="#2A2A3A" stroke-width="1.5"/>

  <!-- X-axis line -->
  <line x1="80" y1="260" x2="650" y2="260" stroke="#2A2A3A" stroke-width="1.5"/>

  <!-- Bar 1: M5 Air (Magenta) -->
  <rect x="100" y="220" width="110" height="40" fill="#FF3CA0" rx="4"/>
  <text x="155" y="248" text-anchor="middle" class="badge" fill="#141419">153 GB/s</text>

  <!-- Bar 1 Label -->
  <text x="155" y="285" text-anchor="middle" class="axis-label">M5 Air</text>

  <!-- Bar 2: M5 Pro (Teal) -->
  <rect x="250" y="110" width="110" height="150" fill="#00BFA5" rx="4"/>
  <text x="305" y="195" text-anchor="middle" class="badge" fill="#141419">614 GB/s</text>

  <!-- Bar 2 Label -->
  <text x="305" y="285" text-anchor="middle" class="axis-label">M5 Pro</text>

  <!-- Bar 3: M5 Max (Chartreuse) -->
  <rect x="400" y="110" width="110" height="150" fill="#B9F43B" rx="4"/>
  <text x="455" y="195" text-anchor="middle" class="badge" fill="#141419">614 GB/s</text>

  <!-- Bar 3 Label -->
  <text x="455" y="285" text-anchor="middle" class="axis-label">M5 Max</text>

  <!-- Y-axis labels (bandwidth scale) -->
  <text x="70" y="265" text-anchor="end" class="tick">0</text>
  <text x="70" y="190" text-anchor="end" class="tick">300</text>
  <text x="70" y="115" text-anchor="end" class="tick">600</text>

  <!-- Y-axis label -->
  <text x="30" y="155" text-anchor="middle" class="axis-label" transform="rotate(-90 30 155)">GB/s</text>

  <!-- Annotation box: Secondary info -->
  <rect x="700" y="80" width="230" height="100" fill="#1E1E26" stroke="#2A2A3A" stroke-width="1.5" rx="8"/>
  <text x="815" y="102" text-anchor="middle" class="label">Key Impact</text>
  <text x="710" y="125" class="tick">4x bandwidth = faster</text>
  <text x="710" y="140" class="tick">MLX inference</text>
  <text x="710" y="158" class="tick">Higher bandwidth benefits</text>
  <text x="710" y="173" class="tick">larger models most</text>

  <!-- Callout box: Practical impact -->
  <rect x="700" y="200" width="230" height="120" fill="#1E1E26" stroke="#2A2A3A" stroke-width="1.5" rx="8"/>
  <rect x="700" y="200" width="230" height="22" fill="#4A9EED" rx="8"/>
  <text x="815" y="217" text-anchor="middle" class="badge" fill="#141419">Qwen3.5 122B (approx)</text>

  <text x="710" y="240" class="tick">Air M5:</text>
  <text x="810" y="240" text-anchor="end" class="label" font-size="11">~11 tok/s</text>

  <text x="710" y="258" class="tick">Pro M5:</text>
  <text x="810" y="258" text-anchor="end" class="label" font-size="11">~32 tok/s</text>

  <text x="710" y="276" class="tick">Max M5:</text>
  <text x="810" y="276" text-anchor="end" class="label" font-size="11">~44 tok/s</text>

  <text x="815" y="305" text-anchor="middle" class="caption">(Estimated relative performance)</text>

  <!-- Bottom note -->
  <text x="30" y="310" class="caption">The M5 Pro and Max share the same 614 GB/s bandwidth. The Max's speed advantage comes from additional GPU cores,</text>
  <text x="30" y="325" class="caption">not bandwidth alone. With proper MLX optimization, both deliver excellent performance for large models.</text>

  <!-- Legend: Extra spacing info -->
  <text x="30" y="350" class="caption">Data sources: Apple M5 specs, MLX-Explore benchmark suite, official Apple memory specifications</text>
</svg>
