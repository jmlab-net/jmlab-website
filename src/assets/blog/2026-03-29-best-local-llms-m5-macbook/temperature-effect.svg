<svg viewBox="0 0 960 350" xmlns="http://www.w3.org/2000/svg" fill="none">
  <defs>
    <linearGradient id="tempGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00BFA5;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#B9F43B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF3CA0;stop-opacity:1" />
    </linearGradient>
  </defs>

  <style>
    text { font-family: 'Segoe UI', system-ui, sans-serif; }
    .title    { font-size: 20px; font-weight: 700; fill: #E5E5E5; }
    .subtitle { font-size: 13px; fill: #A0A0A0; }
    .label    { font-size: 12px; font-weight: 600; fill: #E5E5E5; }
    .axis-label { font-size: 13px; font-weight: 600; fill: #A0A0A0; }
    .tick     { font-size: 11px; fill: #757575; }
    .caption  { font-size: 10px; fill: #757575; }
    .badge    { font-size: 10px; font-weight: 700; }
  </style>

  <!-- Background -->
  <rect width="960" height="350" fill="#141419" rx="12" />

  <!-- Title -->
  <text x="30" y="35" class="title">Temperature: Reliability ↔ Creativity</text>
  <text x="30" y="53" class="subtitle">Tested at 0.0, 0.3, and 0.7 — top models stayed accurate even at 0.7</text>

  <!-- PANEL 1: T=0.0 (Deterministic) -->
  <g id="panel-1">
    <!-- Card background -->
    <rect x="40" y="75" width="280" height="215" fill="#1E1E26" stroke="#2A2A3A" stroke-width="1" rx="8" />

    <!-- Top accent bar (teal) -->
    <rect x="40" y="75" width="280" height="6" fill="#00BFA5" rx="8" />

    <!-- Temperature label -->
    <text x="60" y="105" class="label">T = 0.0</text>
    <text x="60" y="122" class="caption" fill="#00BFA5">(Deterministic)</text>

    <!-- Icon: locked/tight distribution -->
    <circle cx="180" cy="160" r="35" fill="none" stroke="#00BFA5" stroke-width="2" />
    <line x1="180" y1="130" x2="180" y2="190" stroke="#00BFA5" stroke-width="2" />
    <line x1="150" y1="160" x2="210" y2="160" stroke="#00BFA5" stroke-width="1" opacity="0.5" />

    <!-- Lock symbol inside -->
    <rect x="172" y="152" width="16" height="16" fill="none" stroke="#00BFA5" stroke-width="1.5" rx="2" />
    <path d="M 175 152 Q 175 148 180 148 Q 185 148 185 152" fill="none" stroke="#00BFA5" stroke-width="1.5" />
    <circle cx="180" cy="160" r="1.5" fill="#00BFA5" />

    <!-- Use cases -->
    <text x="60" y="220" class="caption">Use cases:</text>
    <text x="60" y="238" class="caption">Code • Math • Facts</text>

    <!-- Bottom label -->
    <text x="60" y="298" class="label" font-size="11" fill="#E5E5E5">Same input → same output</text>
  </g>

  <!-- PANEL 2: T=0.3 (Balanced) -->
  <g id="panel-2">
    <!-- Card background -->
    <rect x="360" y="75" width="280" height="215" fill="#1E1E26" stroke="#2A2A3A" stroke-width="1" rx="8" />

    <!-- Top accent bar (chartreuse) -->
    <rect x="360" y="75" width="280" height="6" fill="#B9F43B" rx="8" />

    <!-- Temperature label -->
    <text x="380" y="105" class="label">T = 0.3</text>
    <text x="380" y="122" class="caption" fill="#B9F43B">(Balanced)</text>

    <!-- DEFAULT badge -->
    <rect x="450" y="95" width="70" height="20" fill="#B9F43B" rx="4" />
    <text x="485" y="108" class="badge" text-anchor="middle" fill="#141419">DEFAULT</text>

    <!-- Icon: slightly wider distribution -->
    <circle cx="500" cy="160" r="35" fill="none" stroke="#B9F43B" stroke-width="2" />
    <ellipse cx="500" cy="160" rx="25" ry="32" fill="none" stroke="#B9F43B" stroke-width="1.5" opacity="0.6" />
    <line x1="470" y1="160" x2="530" y2="160" stroke="#B9F43B" stroke-width="1" opacity="0.5" />

    <!-- Balanced icon (scales) -->
    <line x1="485" y1="145" x2="515" y2="145" stroke="#B9F43B" stroke-width="1.5" />
    <circle cx="490" cy="155" r="5" fill="none" stroke="#B9F43B" stroke-width="1" />
    <circle cx="510" cy="155" r="5" fill="none" stroke="#B9F43B" stroke-width="1" />

    <!-- Use cases -->
    <text x="380" y="220" class="caption">Use cases:</text>
    <text x="380" y="238" class="caption">General use • Chat</text>

    <!-- Bottom label -->
    <text x="380" y="298" class="label" font-size="11" fill="#B9F43B">Slight variation, still reliable</text>
  </g>

  <!-- PANEL 3: T=0.7 (Creative) -->
  <g id="panel-3">
    <!-- Card background -->
    <rect x="680" y="75" width="280" height="215" fill="#1E1E26" stroke="#2A2A3A" stroke-width="1" rx="8" />

    <!-- Top accent bar (magenta) -->
    <rect x="680" y="75" width="280" height="6" fill="#FF3CA0" rx="8" />

    <!-- Temperature label -->
    <text x="700" y="105" class="label">T = 0.7</text>
    <text x="700" y="122" class="caption" fill="#FF3CA0">(Creative)</text>

    <!-- Icon: wide/scattered distribution -->
    <circle cx="820" cy="160" r="35" fill="none" stroke="#FF3CA0" stroke-width="2" />
    <ellipse cx="820" cy="160" rx="32" ry="38" fill="none" stroke="#FF3CA0" stroke-width="1.5" opacity="0.6" />
    <circle cx="800" cy="140" r="2" fill="#FF3CA0" opacity="0.7" />
    <circle cx="840" cy="135" r="2" fill="#FF3CA0" opacity="0.7" />
    <circle cx="850" cy="165" r="2" fill="#FF3CA0" opacity="0.7" />
    <circle cx="790" cy="180" r="2" fill="#FF3CA0" opacity="0.7" />
    <circle cx="835" cy="185" r="2" fill="#FF3CA0" opacity="0.7" />

    <!-- Use cases -->
    <text x="700" y="220" class="caption">Use cases:</text>
    <text x="700" y="238" class="caption">Brainstorming • Writing</text>

    <!-- Bottom label -->
    <text x="700" y="298" class="label" font-size="11" fill="#FF3CA0">More variety, some errors</text>
  </g>

  <!-- SPECTRUM BAR (below panels) -->
  <g id="spectrum">
    <!-- Gradient bar -->
    <rect x="40" y="305" width="920" height="20" fill="url(#tempGradient)" rx="4" />

    <!-- Left label: Reliable -->
    <text x="40" y="338" class="caption" fill="#00BFA5">Reliable</text>

    <!-- Right label: Creative -->
    <text x="920" y="338" class="caption" text-anchor="end" fill="#FF3CA0">Creative</text>
  </g>

</svg>