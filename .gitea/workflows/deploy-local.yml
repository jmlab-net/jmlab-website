name: Deploy Local Dev

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: Build Astro site
        run: npm run build
        env:
          SITE_URL: https://REDACTED_HOSTNAME

      - name: Deploy to Nginx web root
        run: |
          rm -rf /srv/nginx/www/dev/*
          mkdir -p /srv/nginx/www/dev
          cp -r dist/* /srv/nginx/www/dev/
