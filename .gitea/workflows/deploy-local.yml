name: Deploy Local Dev

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Debug - check mounts
        run: |
          echo "=== mount points ==="
          mount | grep nginx || echo "no nginx mount found"
          echo "=== check /srv ==="
          ls -la /srv/ || echo "/srv does not exist"
          echo "=== check /srv/nginx ==="
          ls -la /srv/nginx/ || echo "/srv/nginx does not exist"
          echo "=== check /srv/nginx/www ==="
          ls -la /srv/nginx/www/ || echo "/srv/nginx/www does not exist"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: Build Astro site
        run: npm run build
        env:
          SITE_URL: https://dev.local.jmlab.net

      - name: Deploy to Nginx web root
        run: |
          echo "=== dist contents ==="
          ls -la dist/
          echo "=== deploying ==="
          mkdir -p /srv/nginx/www/dev
          rm -rf /srv/nginx/www/dev/*
          cp -r dist/* /srv/nginx/www/dev/
          echo "=== deployed contents ==="
          ls -la /srv/nginx/www/dev/
